l_english:
 agrarian_populism_desc:0 "Combines elements of populism with a focus on the interests of rural communities and farmers."
 agrarian_populism_voter_breakdown_tt:0 "§HBase of Support:§!\nRural Farmers: §Y[?elec_bloc_support^1|0]%§!\n\n§7Deep roots in the countryside, promising land and security.§!"
 anarchism_desc:0 "The rejection of authority itself, promoting the division of society into self-managing collectives."
 anarchism_voter_breakdown_tt:0 "§HBase of Support:§!\nIndustrial Workers: §Y[?elec_bloc_support^0|0]%§!\n\n§7Total rejection of the state apparatus.§!"
 anarchist_communism_desc:0 "Embraces communism as a stateless society, favoring voluntary associations and mutual aid over a central state."
 anarchist_communism_voter_breakdown_tt:0 "§HBase of Support:§!\nIndustrial Workers: §Y[?elec_bloc_support^0|0]%§!\nMinority Communities: §Y[?elec_bloc_support^5|0]%§!\n\n§7Rejects state authority in favor of mutual aid.§!"
 anti_revisionism_desc:0 "Advocates retaining key elements of original revolutionary theory, opposing capitalist economic elements."
 anti_revisionism_voter_breakdown_tt:0 "§HBase of Support:§!\nIndustrial Workers: §Y[?elec_bloc_support^0|0]%§!\n\n§7Strict adherence to foundational communist doctrine.§!"
 authoritarianism:0 "Authoritarianism"
 authoritarianism_desc:0 "Authoritarian"
 authoritarianism_subtype_desc:0 "Authoritarianism is a form of government characterized by strong central power and limited political freedoms."
 buddhist_socialism_desc:0 "A unique ideological fusion seeking socialist equality through spiritual and communal frameworks."
 buddhist_socialism_voter_breakdown_tt:0 "§HBase of Support:§!\nRural Farmers: §Y[?elec_bloc_support^1|0]%§!\n\n§7A unique fusion of spiritual duty and collective ownership.§!"
 centrism_desc:0 "Seeks common sense solutions that address needs while supporting the public trust."
 centrism_voter_breakdown_tt:0 "§HBase of Support:§!\nWhite Collar Class: §Y[?elec_bloc_support^4|0]%§!\nWealthy Elite: §Y[?elec_bloc_support^3|0]%§!\n\n§7Aims for absolute middle-of-the-road consensus.§!"
 christian_democracy_desc:0 "Seeks to apply Christian principles to public policy, advocating for social justice, human rights, and a market economy tempered by moral intervention."
 christian_democracy_voter_breakdown_tt:0 "§HBase of Support:§!\nRural Farmers: §Y[?elec_bloc_support^1|0]%§!\nWomen Voters: §Y[?elec_bloc_support^6|0]%§!\n\n§7Supported by conservative moralists seeking social cohesion.§!"
 civil_nationalism_desc:0 "Emphasizes the importance of a shared civic identity and values in defining the nation."
 civil_nationalism_voter_breakdown_tt:0 "§HBase of Support:§!\nWhite Collar Class: §Y[?elec_bloc_support^4|0]%§!\n\n§7Promotes national unity through shared civic identity.§!"
 communism_desc:0 "Communist"
 communism_noun:0 "Communism"
 communism_subtype_desc:0 "Communism is a philosophical, social, political, and economic ideology and movement whose ultimate goal is the establishment of a communist society."
 conservatism:0 "Conservatism"
 conservatism_desc:0 "Conservative"
 conservatism_ideology_desc:0 "Conservative State"
 conservatism_ideology_noun:0 "Conservatism"
 conservatism_subideology_desc:0 "Considering rapid changes to society to be potentially harmful, conservatism espouses tradition and moderate reforms."
 conservatism_subideology_voter_breakdown_tt:0 "§HBase of Support:§!\nRural Farmers: §Y[?elec_bloc_support^1|0]%§!\nWealthy Elite: §Y[?elec_bloc_support^3|0]%§!\n\n§7Support rests heavily on traditional values.§!"
 conservatism_subtype_desc:0 "Conservatism is a political and social philosophy promoting traditional social institutions in the context of culture and civilization."
 corporate_technocracy_desc:0 "Advocates for the governance of society by technical experts and corporate leaders."
 corporate_technocracy_voter_breakdown_tt:0 "§HBase of Support:§!\nWealthy Elite: §Y[?elec_bloc_support^3|0]%§!\nWhite Collar Class: §Y[?elec_bloc_support^4|0]%§!\n\n§7Governance by technical experts and corporate interests.§!"
 democratic_desc:0 "Liberal State"
 democratic_noun:0 "Liberalism"
 despotism_desc:0 "A form of government in which a single person rules with absolute power."
 despotism_voter_breakdown_tt:0 "§HBase of Support:§!\nMilitary Personnel: §Y[?elec_bloc_support^2|0]%§!\n\n§7Absolute rule backed by force of arms.§!"
 emperor_fascism_voter_breakdown_tt:0 "§HBase of Support:§!\nMilitary Personnel: §Y[?elec_bloc_support^2|0]%§!\n\n§7Unflinching loyalty to the divine sovereign.§!"
 falangism_desc:0 "An authoritarian ideology with traits of fascism and conservatism, valuing national and Catholic identity."
 falangism_voter_breakdown_tt:0 "§HBase of Support:§!\nMilitary Personnel: §Y[?elec_bloc_support^2|0]%§!\nRural Farmers: §Y[?elec_bloc_support^1|0]%§!\n\n§7Blends national syndicalism with deep Catholic identity.§!"
 farmer_laborism_desc:0 "Combines elements of agrarianism and labor rights, advocating for the interests of farmers and workers through democratic governance."
 farmer_laborism_voter_breakdown_tt:0 "§HBase of Support:§!\nRural Farmers: §Y[?elec_bloc_support^1|0]%§!\nIndustrial Workers: §Y[?elec_bloc_support^0|0]%§!\n\n§7A potent alliance of the working and agrarian classes.§!"
 fascism_ideology_desc:0 "Encompassing a variety of ultra-nationalist movements, typically venerating devotion to the state."
 fascism_ideology_voter_breakdown_tt:0 "§HBase of Support:§!\nMilitary Personnel: §Y[?elec_bloc_support^2|0]%§!\nWhite Collar Class: §Y[?elec_bloc_support^4|0]%§!\n\n§7Rising sentiment fueled by radical officers and national rebirth.§!"
 fascism_noun:0 "Fascism"
 gen_nazism_desc:0 "Rooted in extreme nationalism and driven by ideas of racial supremacy."
 gen_nazism_voter_breakdown_tt:0 "§HBase of Support:§!\nMilitary Personnel: §Y[?elec_bloc_support^2|0]%§!\n\n§7Driven by extreme racial supremacy and militarism.§!"
 generic_voter_breakdown_tt:0 "§HBase of Support:§!\nBroad Coalition Voters\n\n§7This faction draws support evenly across the national spectrum.§!"
 integral_nationalism_desc:0 "Emphasizes the unity and indivisibility of the nation, advocating for a strong centralized state."
 integral_nationalism_voter_breakdown_tt:0 "§HBase of Support:§!\nMilitary Personnel: §Y[?elec_bloc_support^2|0]%§!\nWealthy Elite: §Y[?elec_bloc_support^3|0]%§!\n\n§7Demands a highly centralized state overriding individual rights.§!"
 japan_militarism_ideology_voter_breakdown_tt:0 "§HBase of Support:§!\nMilitary Personnel: §Y[?elec_bloc_support^2|0]%§!\n\n§7Values martial honor, discipline, and imperial expansion.§!"
 kr_government_grouping:0 "Ideological Group"
 leninism_desc:0 "Seeks to establish a socialist state by a vanguard party leading a revolution overthrowing capitalist society."
 leninism_voter_breakdown_tt:0 "§HBase of Support:§!\nIndustrial Workers: §Y[?elec_bloc_support^0|0]%§!\nMilitary Personnel: §Y[?elec_bloc_support^2|0]%§!\n\n§7Advocating a vanguard party to seize the state.§!"
 liberal_integrationism_desc:0 "Seeks to integrate liberal values with social and economic policies aimed at promoting unity and cooperation."
 liberal_integrationism_voter_breakdown_tt:0 "§HBase of Support:§!\nWhite Collar Class: §Y[?elec_bloc_support^4|0]%§!\nMinority Communities: §Y[?elec_bloc_support^5|0]%§!\n\n§7Focuses on unity and inclusive liberal policy.§!"
 liberalism_desc:0 "Liberal"
 liberalism_subideology_voter_breakdown_tt:0 "§HBase of Support:§!\nWhite Collar Class: §Y[?elec_bloc_support^4|0]%§!\nWealthy Elite: §Y[?elec_bloc_support^3|0]%§!\n\n§7The establishment choice for a stable market economy.§!"
 liberalism_subtype_desc:0 "Liberalism is a political and moral philosophy based on liberty, consent of the governed and equality before the law."
 marxism_desc:0 "Marxist politics seek to apply the theories of Karl Marx to political practice, defined by class struggle."
 marxism_voter_breakdown_tt:0 "§HBase of Support:§!\nIndustrial Workers: §Y[?elec_bloc_support^0|0]%§!\n\n§7Driven by union militancy and anti-capitalist theory.§!"
 moderatism_desc:0 "Avoids the extremes of left and right by taking a moderate, pragmatic position."
 moderatism_voter_breakdown_tt:0 "§HBase of Support:§!\nWhite Collar Class: §Y[?elec_bloc_support^4|0]%§!\nWomen Voters: §Y[?elec_bloc_support^6|0]%§!\n\n§7A cautious, pragmatic approach avoiding all extremes.§!"
 nationalism:0 "Nationalism"
 nationalism_desc:0 "Nationalist"
 nationalism_subtype_desc:0 "Nationalism is an ideology and movement that promotes the interests of a particular nation, especially with the aim of gaining and maintaining the nation's sovereignty over its homeland."
 nazism_desc:0 "Rooted in extreme nationalism and driven by ideas of Germanic supremacy."
 nazism_voter_breakdown_tt:0 "§HBase of Support:§!\nMilitary Personnel: §Y[?elec_bloc_support^2|0]%§!\n\n§7Driven by extreme racial supremacy and militarism.§!"
 neutrality_desc:0 "Authoritarian Regime"
 neutrality_noun:0 "Authoritarianism"
 oligarchism_desc:0 "A form of government in which a group of people rule with absolute power."
 oligarchism_voter_breakdown_tt:0 "§HBase of Support:§!\nWealthy Elite: §Y[?elec_bloc_support^3|0]%§!\n\n§7Power concentrated purely in the hands of the wealthy few.§!"
 organical_statism_desc:0 "Views the state as a living organism, advocating for a strong centralized government."
 organical_statism_voter_breakdown_tt:0 "§HBase of Support:§!\nWealthy Elite: §Y[?elec_bloc_support^3|0]%§!\nMilitary Personnel: §Y[?elec_bloc_support^2|0]%§!\n\n§7Treats the state as a living, unified organism requiring strict harmony.§!"
 populism:0 "Populism"
 populism_desc:0 "Populist"
 populism_ideology_desc:0 "Populist Regime"
 populism_ideology_noun:0 "Populism"
 populism_subideology_desc:0 "Populism seeks to represent the interests of ordinary people against a perceived elite or establishment."
 populism_subideology_voter_breakdown_tt:0 "§HBase of Support:§!\nRural Farmers: §Y[?elec_bloc_support^1|0]%§!\nIndustrial Workers: §Y[?elec_bloc_support^0|0]%§!\n\n§7A coalition of the common man, frustrated by elitism.§!"
 populism_subtype_desc:0 "Populism refers to a range of political stances that emphasize the idea of 'the people' and often juxtapose this group against 'the elite'."
 rexism_desc:0 "Strongly opposed to both liberal and communist ideals, advocating a corporatist economic policy."
 rexism_voter_breakdown_tt:0 "§HBase of Support:§!\nWhite Collar Class: §Y[?elec_bloc_support^4|0]%§!\n\n§7Conservative, corporatist, and aggressively anti-communist.§!"
 socialism:0 "Socialism"
 socialism_desc:0 "Socialist"
 socialism_ideology_desc:0 "Socialist State"
 socialism_ideology_noun:0 "Socialism"
 socialism_subideology_voter_breakdown_tt:0 "§HBase of Support:§!\nIndustrial Workers: §Y[?elec_bloc_support^0|0]%§!\n\n§7Pushes for systemic reform without violent revolution.§!"
 socialism_subtype_desc:0 "Socialism is a political, social and economic philosophy encompassing a range of economic and social systems characterised by social ownership of the means of production."
 stalinism_desc:0 "Emphasizes rapid industrialization and collectivization as well as the need for a strong, authoritative socialist state."
 stalinism_voter_breakdown_tt:0 "§HBase of Support:§!\nMilitary Personnel: §Y[?elec_bloc_support^2|0]%§!\nIndustrial Workers: §Y[?elec_bloc_support^0|0]%§!\n\n§7Heavily bolstered by hardline officers and central planners.§!"
