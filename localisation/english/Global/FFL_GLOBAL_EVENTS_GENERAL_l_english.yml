 ffl_news.2.a:0 "The Next Russia?"
 ffl_news.2.desc:0 "On the front cover of todays newspaper is a photograph of Utpon Sinclair in a fighting pose, looking slightly scared. In a radical political upset the perennial socialist candidate in California has won the election. This marks the end of almost 40 years of Democratic isolation from the government.\n    All accross the state inexperienced socialists officials are adopting there roles as mayors and representatives. Many of the large industries of the state fear that this is just the beginning of a Bolshevik revolution and already conservatives have publicly resolved to resist Sinclair's agenda."
 ffl_news.2.t:0 "Socialist Wins California!"
