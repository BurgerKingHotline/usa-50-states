l_english:
 ffl_news.1.t:0 "Conservatives Elected California!"
 ffl_news.1.desc:0 "In a hotly tested campaign Frank Merriam, the incumbent Republican governor has won the election against Upton Sinclair. Riding on a wave of violent anti-communist sentiment the conservative establishment has sidelined yet another democratic president, for the 40th year in a year.\n   Things are not well in the state of California however, as many socialists now fear a violent state crackdown, and the threat of a commmunist revolution has only just crested not subsided."
 ffl_news.1.a:0 "Is A White Terror Next?"
 ffl_news.2.a:0 "The Next Russia?"
 ffl_news.2.desc:0 "On the front cover of todays newspaper is a photograph of Utpon Sinclair in a fighting pose, looking slightly scared. In a radical political upset the perennial socialist candidate in California has won the election. This marks the end of almost 40 years of Democratic isolation from the government.\n    All accross the state inexperienced socialists officials are adopting there roles as mayors and representatives. Many of the large industries of the state fear that this is just the beginning of a Bolshevik revolution and already conservatives have publicly resolved to resist Sinclair's agenda."
 ffl_news.2.t:0 "Socialist Wins California!"
 ffl_news.3.t:0 "Jefferson Secedes California"
 ffl_news.3.desc:0 "In surprising news, the small northern region of California known as Jefferson has been allowed to secede, forming an independent state government. To many's suprise the parting has been more or less amicable, despite violence on both sides.\n   Things are not perfect for the newest Republic however, as violent militias still rule most of the country, and it's traditional poverty and isolation lends few oppurtunities for improving."
 ffl_news.3.a:0 "Beautiful Country"
 ffl_news.4.t:0 "California Invades Jefferson!"
 ffl_news.4.desc:0 "Following a declaration of seccession from the provisionl Jefferson government, Sacramento has now declared war and begun mobilizing an invading force. Despite initial hopes of a peaceful seccession it now seems that the poor and chaotic region is doomed to even more violence.\n   The newest Republic faces multiple problems, with violent militias controlling much of it's country, and it's traditional poverty and isolation lending few oppurtunities."
 ffl_news.4.a:0 "To Be Smothered In The Crib?"
 ffl_news.5.t:0 "Commune of San Francisco"
 ffl_news.5.desc:0 "Following months of violence and escalation communists have couped the city government of San Francisco setting up a 'Workers Commune' and pledging to fight for the workers of the city. This follows a failed attempt to gain control of the city and a startling turn in Californian politics."
 ffl_news.5.a:0 "Terrible"
