l_english:
 CAS_three_pillars:0 "Three Pillars"
 CAS_three_pillars_desc:0 "Despite the fact that we are united in war against a common enemy our movement remains heavily divided and fractured. While Mr. Sinclair still enjoys popular support, at least for the time being, our new government is precariously balanced across three strong pillars. Each one has their own unique interests and base of support, and we will not survive as a state scurrying to and fro trying to meet the demands of all of them. Choose wisely."
 CAS_epic_democrats:0 "E.P.I.C. Democrats"
 CAS_epic_democrats_desc:0 "Who are the E.P.I.C. Democrats? They are the moderates and progressives of the democrat party who wish for government intervention into the economy and a wide saftey net. By far the largest base of our support, they lack any coherent political organization due to the rather pitiful state of the Democratic party in California. Many of them have voted and are fighting for our government, with the expectation that our more radical policies such as confiscating property will be rolled back, and that we are significantly less radical than the newsreels would've had them believe. Upton Sinclair personally sympathizes greatly with these people, even seriously considering rolling back much of his programe during the campaign.\n      Solidifying our support among them will cost much if not all of our more extreme supporters, but may be the best option to mend the chasms between rich and poor, democrat and republican, centrist and radical."
 CAS_reorganize_dem_party:0 "Reorganize Democratic Party"
 CAS_reorganize_dem_party_desc:0 "While it was our original intent to shed the democratic party after election into office, it has become clear that it is still a useful organization. However it will have to be reorganized, the socialists, communists, and union workers who were previously alienated by it, must feel that it is their party. It must truly become a party for the worker, a party for anti-capitalism, and a party of reform."
 CAS_rehabilitate_conservatives:0 "Rehabilitate Conservatives"
 CAS_rehabilitate_conservatives_desc:0 "We are not a dictatorship, we do not seek to establish a one-party state. In a functioning democracy even those who are wrong can have a say in government, we must make sure there is a place in our government for the people who disagree with us. While we cannot allow the Republican party to operate freely within our state, as we are currently at war with them, a conservative commonwealth opposition party can be created. Though we will have to face opposition in government we will hopefully face less opposition fighting us in the streets of our cities and in the farmlands of our valleys."
 CAS_promise_property_rights:0 "Promise Property Rights"
 CAS_promise_property_rights_desc:0 "By far the greatest fear of our government is that we will confiscate or steal hardwon property. In order to assuage this fear we must promise to never start. All property nationalised will be done by legitimate and optional purchase, and the right of private property will be sacred, like every other right, under our regime."
 CAS_not_your_enemy:0 "We Are Not Your Enemy!"
 CAS_not_your_enemy_desc:0 "We have done more than enough work now to reassure people that we are not out to get them. We are not the commie boogieman they were conditioned to fear, all we wish to do is ensure a fair share for the worker. No longer must people fear us, instead we must rally against our common enemies, the fascists in orange county and the fascists in sacramento!"
 CAS_democracy_compromise:0 "Democracy is Built On Compromise"
 CAS_democracy_compromise_desc:0 "It is an unfortunate truth but running a fair an non-tryannical government means you can't have things your way all the time. Compromise is nessescary, give and take, and if either side is ever happy something has gone wrong. While a dissapointing truth, recognizing this and incorporating it into our governance means that we will be able to truly work with the conservatives and reactionaires under our governance."
 CAS_american_commonwealth:0 "American Commonwealth"
 CAS_american_commonwealth_desc:0 "We have done it, we have established a commonwealth in the American tradition. While it may not be exactly how the founding fathers intended, our government still represents a definite continuity from past to present. We are a two party republic in which all sides have a say, no matter how much they may disagre with each other."
 CAS_sinclairists:0 "Sinclairist Socialists"
 CAS_sinclairists_desc:0 "Despite what the D.S.A. may wish, the real voice of socialism in California is Upton Sinclair. He is many things, an author, an artist, a visionary, a voice of the proletariat, and a socialist. As the war wages on his books have only soared in popularity all across California, and they provide more than enough basis for a unique and distinctive form of socialism. One capable of resisting both the excesses of capitalism, the tryanny of communism, and incorporating the hard-won lessons of the european socialist parties.\n      This new commonwealth we are about to build will be radical, it will be unique, and most of all it will be one truly by and for the people. This is not a responsibility Sinclair can afford to shove off, it has been thrust upon him, surprised him against his will, but he will bear the mantle. He alone may be able to usurp the conservativism of the state and replace it with a deeply popular democratic socialism."
 CAS_fishbowl_democracy:0 "Fishbowl Democracy"
 CAS_fishbowl_democracy_desc:0 "The previous government was vagued in secrecy and well shielded from private eyes. The governors and representatives operated without any visibility and the citizens of the state operated in total ignorance of their government. No more.\n      Even in the middle of the war Sinclair will ensure that hours of his day, each day are dedicated to giving announcements over the radio, giving interviews to journalists and private citizens, all in the full view of the media and press. No more will the governorship be shielded in darkness, it will be like a fishbowl, were there is total transparency and constant dialouge with the citizenry."
 CAS_worker_speaks:0 "The Worker Speaks"
 CAS_worker_speaks_desc:0 "Upton Sinclair is the last man who would wish to be a dictator, but the worker has been silenced for too long. He is not speaking for them, he is merely a channel for their demands. Too long the workers have been beaten and shot for daring to disobey or strike. No longer, an extensive program of worker and union protections, as well as ensured representation in government will ensure such tryanny never happens again."
 CAS_weaken_the_executive:0 "Weaken the Executive"
 CAS_weaken_the_executive_desc:0 "While it is also true that Sinclair is more than anxious to his gubernatorial responsibilities and get back to his writing, it is also true that for the longest time the executive suite has accumulated unacceptable power. Abusing their power and oppresing the worker, as shown by the butchering of the bonus army by Hoover and his cronies. The governor will be limited to one term, continuing a long Californian tradition of governors only serving one term, as well as having their powers and influence greatly diminished. We will be lead by the voice of the people, not by any one strongman."
 CAS_crusade_against_fascism:0 "Crusade Against Fascism"
 CAS_crusade_against_fascism_desc:0 "What we have here is not just a political movement, not just a riot, not just a revolution, but a crusade against the fascist and autocratic systems which have enserfed the worker for so long. We must rally all our forces against these most villianous of foes."
 CAS_cooperative_party:0 "Mend Party Divisions"
 CAS_cooperative_party_desc:0 "Socialist history is a long one of unfortunate infighting. Progressives and socialists all bickering against each other, instead of uniting with each other and fighting for the people. We must create such a party, a broad one built on the proletariat, incorporating all those who seek a just tommorow. Opposition will be allowed, but they will have no hope of achieving power when faced with such a formidable coalition."
 CAS_european_style_parliament:0 "European Style Parliament"
 CAS_european_style_parliament_desc:0 "The Senate was established as a mean of autocratic control, so that in case the workers took over the system, such as in our case the rich Columbian elite could quickly shut the system down and regain control. It is totally unnessescary and far too autocratic for such an equitable and free system such as ours. The senate should be abolished and the similiar restrictions on the house of representatives abolished, we shall also reform the voting system, transforming it into a European style parliament, worthy of such a modern democracy as ours."
 CAS_communists:0 "Communists"
 CAS_communists_desc:0 "By far the most radical element of our support are the communists, imbedded in the artists, in the unions, in the worker battalions, they are few in number but they are influential and ruthless. While this is not what Sinclair wouldn't want, providence and the people demand otherwise. Our current democratic system can only end in capitalistic enslavement, it must be totally overthrown and a workers republic established in its place."
 CAS_aid_from_soviet_union:0 "Aid From Soviet Union"
 CAS_aid_from_soviet_union_desc:0 "Accepting aid from the U.S.S.R. is a controversial decision, and a door that cannot be closed. In exchange for aid and a greater chance of overthrowing the old capitalist regime we will also let the bolsheviks have a frightening amount of influence and free reign in our affairs. This could easily spiral out of control and achieve the worst fears of everyone involved, California becoming a puppet state of the Soviet Union."
 CAS_organize_loyal_officers:0 "Organize Loyal Officers"
 CAS_organize_loyal_officers_desc:0 "Inside our military and militias are countless officers who can be convinced to join our cause. As of yet they remain distracted and unknowing of each other, but by organizing amongst ourselves we will be able to establish loyalty among certain key divisions, and establish control over certain key strategic regions."
 CAS_military_coup:0 "Military Coup"
 CAS_military_coup_desc:0 "While many socialists may protest that revolution must come from down below, we know that we cannot wait for the worker to place us in power, we must sieze control before the situation requires it. This is a dangerous step, that cannot be untaken, it will mean the dismantling of democracy and the shattering of any pretext of coalition. But the time has past for the class traitors and bourgeoise hypocrites to dither and babble, now is time for the communism."
 CAS_show_trials:0 "Show Trials"
 CAS_show_trials_desc:0 "We can learn a thing or two from Stalin. By purging our ranks even of loyal supporters, by shocking and horrifying the people with their fictional and confessed crimes we will be able to inculcate an environment of fear and paranoia. This will ensure that we remain in total control and keep everyone on their toes, ever obedient to the cause. Only one question remains, what to do about Sinclair?"
 CAS_establish_commisar_system:0 "Establish Commisar System"
 CAS_establish_commisar_system_desc:0 "Our armies are already in near revolt at our hostile takeover. No more, we shall establish an elaborate system of commisars, similiar to the Russian system to ensure that if anyone in the military even thinks of a countercoup they will be taken in for questioning."
 CAS_workers_dictatorship:0 "Workers Dictatorship"
 CAS_workers_dictatorship_desc:0 "The revolution is complete, the worker has taken control and now capitalism the old capitalist system has been officially abolished. But much work remains to be done if we are to realize a true communist utopia, one might almost regret the enormous cost it has taken us to get here."