l_english:
 CAL_intro_focus:0 "Picking Up The Pieces"
 CAL_intro_focus_desc:0 "Following the great collapse much of California, a vast and largely rural state, has fallen into almost total anarchy. State officials have been working day and night tirelessely, while police officers and the army have been going without pay. With limited and dwindling resources it is ultimately up to James Rolph on how to spend them."
 CAL_declare_new_elections:0 "Call Elections"
 CAL_declare_new_elections_desc:0 "Due to the extrodinary circumstances and Rolph's own failing health, he has proposed a bill that would bring the gubernatorial elections a full year ahead. When he was elected to Office over three years ago the world was a much different place, and now after all that has happened it is only fair that the people get a say in what the new countrys future will look like.\n      Hopefully the election of a new and popular governor will bring legitimacy and stability, lest the great collapse extend to the state of California."
 CAL_sinclairs_vision_soc:0 "The E.P.I.C. Plan"
 CAL_sinclairs_vision_soc_desc:0 "Upton Sinclair has written a pamphlet describing a radical new vision for California. In it he lists multiple radical measures to help bring an end to the great depression, and thereby, hopefully, the political instability of the new republic. While the public reception to his ideas will be uncertain until it is published, it is clear that he is gearing up for a more significant attempt at governorship than previously."
 CAL_room_for_an_author_soc:0 "Room For An Author?"
 CAL_room_for_an_author_soc_desc:0 "What room will there be for an author, for an artist, if a Hitler were to come, or a Mussolini? There would be none, him and all his fellow freemen would be crushed under fascistic boots.\n      While the corporate oligarchy frightens people with the potential of communist revolt they totally neglect the real threat. We must remind people of their duty to democracy to defend against these villians.\n      If Sinclair is not elected and the E.P.I.C. plan or similiar is not enacted, it is inevitable that our economic woes will deliver us to a similiar fate."
 CAL_union_support_soc:0 "Union Support"
 CAL_union_support_soc_desc:0 "While the conservatives have every instrument of the establishment at hand, we have one thing they do not. Behind the scenes they bite and chew at each other for every last dollar, while we are united in our defense of the worker and labor, and our love of liberty.\n      We need each other. As the workers engage in a total struggle against explotaition, we struggle for political legitimacy, and it is past time we work together to solve both our problems."
 CAL_battlefield_of_the_press:0 "Battlefield of the Press"
 CAL_battlefield_of_the_press_desc:0 "The press, while traditionally trustworthy, is deeply conservative and anti-communist. However in recent months, there neutrality has started to dissolve with slanderous and falsified attacks against Upton Sinclair.\n      The media front is now one too important to ignore, and we must only hope that the public sees things our way."
 CAL_pattons_plan_con:0 "Pattons Plan"
 CAL_pattons_plan_con_desc:0 "Patton is not a man interested in politics, but what he does have is military experience and charisma, and lots of it. The soldiers love him, his superordinates despise him, and he has a plan to save California from the anarchy it finds itself in.\n      A big military budget.\n      So simply put it is hard to see how this would aid our situation, but there is one major advantage. We are simply unable to control California, by establishing a large military we would be able to easily suppress any attempted revolt and restore a basic degree of law and order."
 CAL_build_tanks_con:0 "Tanks or Infantry?"
 CAL_build_tanks_con_desc:0 "This is a rather simple question but there is a lot behind it. General Patton is firmly on the side of building more tanks, emphasizing the importance of speed, and overwhelming force. While some tank units would be a nice addition to our army it is hard to argue against simply hiring more soldiers.\n      It would be significantly cheaper and allow us to field a greater force for the same cost, allowing us to hopefully bring order to more of California. After all, that is the whole point... right?"
 CAL_moscows_man_con:0 "Moscow's Man"
 CAL_moscows_man_con_desc:0 "Upton Sinclair plainly put, is a communist. It doesn't matter whether or not he calls himself a socialist or a democrat or whatever, the plain truth of the matter is he is here to overthrow our republic and establish a bolshevik soviet.\n      We cannot let the public happen, and we must flame the fears of communism to a burning pitch, lest we lose our freedom forever. After all, capitalism is what enables our free way of life."
 CAL_plan_starvation_soc:0 "Plan of Starvation"
 CAL_plan_starvation_soc_desc:0 "While the fat cats lounge in their high chairs, getting fat and drunk, the worker is facing a long and hopeless tunnel. Food rots in the field, while children go hungry, all for the sake of profit.\n      The socialist movement has a chance to make the people see for the first time the flaws of capitalism. There are only too plans for the future, our plan of rebirth and rejuvenation, and their five year plan of starvation."
 CAL_protect_ourselves_soc:0 "Arm Ourselves"
 CAL_protect_ourselves_soc_desc:0 "Everywhere the worker is being slaughtered and beat down, with the help of the police, and militias, and mobs. If we are to have any hope of our survival it is too arm ourselves, and to meet violence with equal force, as is our constitutional rights. We will either save ourselves or be die trying."
 CAL_our_industrial_connections_con:0 "Our Industrial Connections"
 CAL_our_industrial_connections_con_desc:0 "It is no secret the influence that large corporations have on Californian politics, some would even go so far as to say they run the place. However our friends are an important resource, not just of funding of political and economic power.\n      By asking them for help building up our military-industrial complex we will ensure a stronger and more prosperous future."
 CAL_save_democracy_con:0 "Save Democracy"
 CAL_save_democracy_con_desc:0 "Everything is at stake, lest we slide into the shadows of totalitarianism. There is no difference between communism or socialism, and those helpful idiot progressives are just as dangerous. We must ensure the loyaltly of our soldiers, our civil workers, and even our communities.\n      Every measure must be taken so that even if by some coup the socialists come to power we still maintain control over a majority of the country. This is not an act of militaristic intervention in politics as the military has no interest in such a thing, it is just a securing of public saftey and a protection of our liberties.\n      Else what is the government for?"
 CAL_secure_la_soc:0 "Secure L.A."
 CAL_secure_la_soc_desc:0 "Las Angeles has from the very start been the hub of the E.P.I.C. movement, where Sinclair spends most of his time and gives most of his speeches. Additionally it is perhaps the singularly most important city in California, containing half the states population.\n      As the rest of the country spirals into ever greater violence we must make sure that the worker is at least protected here, in the heart of our movemet, or else what is this all for?"
 CAL_rig_the_election_con:0 "Rig the Elections"
 CAL_rig_the_election_con_desc:0 "Simply we cannot trust the election to bring us into power. While we would doubtless win by a landslide in a fair and secure election, this is not the case, as we speak communist spies are undermining them, falsifying votes, intimidating workers, and throwing out real ones.\n      In a dirty fight you don't play fair, we must not be naive, we must block every avenue to power lest Upton Sinclair and his degenerate horde swallow us whole."
 CAL_absorb_failing_businesses:0 "Absorb Failing Businesses"
 CAL_absorb_failing_businesses_desc:0 "In part due to the great depression and partly due to the capitalist no longer being able to steal the profits off the worker, many more large private businesses are failing. Rather then letting them fall and take out the innocent people with them, through CAL and CAP we will acquire these businesses and put them to work as cooperatives for the greater good of all. Even the capitalists though they now it not yet."
 CAL_assemble_brain_trust:0 "Assemble Brain Trust"
 CAL_assemble_brain_trust_desc:0 "In the various college groups Sinclair has met professors who were experts in government and financial affairs. He has watched these men and tested them, and now made use of their technical knowledge. Many newspapers have begun adopting his term for them, the Califorrnia Brain Trust."
 CAL_ban_advertising:0 "Ban Advertising"
 CAL_ban_advertising_desc:0 "One of the main way these businesses make their money and spread their influence is through advertisements. This level of propaganda is not necesscary in a democratic society and should be banned. As a bonus this will help drive radio stations, newspapers, and other capitalist vechiles which rely on them into bankruptcy and in turn into the hands of the people."
 CAL_black_hand:0 "Black Hand"
 CAL_black_hand_desc:0 "The men who have made this condition are a little band of “insiders,” the masters of our chain banks, railroads, and public service corporation. In my book, “The Goose-Step,” written ten years ago, I described them as the “Black Hand of California” Ever since the World War they have maintained a terrorist organization known as “The Better America Federation,” by means of which they have excluded from public life in this State every man and woman who is not their servant. There is no crime these masters have stopped at."
 CAL_cam_education_department:0 "Out the Bank,\n into the State"
 CAL_cam_education_department_desc:0 "Many Californians are rightly skeptical of their government, and even more so unfairly of the new socialists in charge, and as such have succumbed to propaganda and misinformationd directed at our cause.\n\nDue to this not enough are buying the bonds needed to fund our programs. To fix this CAM will establish an education department for the purpose of explaining the value and importance of the bonds to the public. The issues will be of denominations of from ten dollars to one thousand, and of two kinds, long term bonds and those redeemable upon thirty days notice, The latter will constitute in effect a state savings bank.\n\nIt is important the the people take their money out of the capitalist banks and put them into the state instead."
 CAL_confront_radio_stations:0 "Confront Radio Stations"
 CAL_confront_radio_stations_desc:0 "One of our most importan next actions is to address a letter to the heads of the large radio stations in California. During the campaign for the EPIC plan there had been no pretense on the part of the radio stations to equality of treatment for both sides of the controversy.\n\nBut now that time is past, with the authority of the Governor we can now ask them  to place at the disposal of your Governor a desirable radio hour on two evenings of each week, whereby he may speak to the people over a network which will reach the entire State. And ask that in case of emergency the Governor may have radio time at not more than size hours notice.\n\nAlternatively we could go even further and threaten them if they refuse to report positively on our administration. While a less democratic option it would just be copying exactly what the enemy is already doing."
 CAL_death_of_autocracy:0 "Death of Autocracy"
 CAL_death_of_autocracy_desc:0 "That is the struggle of Democracy today; to overcome the power which the business autocracy holds over newspapers, magazines, radios, moving pictures, universities and colleges, schools, churches, and political parties. These things they control because they hold the purse-strings, and without money it is impossible to reach the people, to give them facts and ideas, to changer their opinions and move them to action. We must make the people understand that this is their fight not ours."
 CAL_death_tax:0 "Death Tax"
 CAL_death_tax_desc:0 "We will increase the Inheritance tax, steeply graduated and apply to all properties in the State regardless of where the owner may reside. This law will take for the State 50% of all money above $50,000 bequeathed to an individual and 50% above $250,000 bequeathed by an individual. In this manner massive amounts of wealth will not be allowed to accumulate endlessely at the top of the economy."
 CAL_empower_unions:0 "Empower Unions"
 CAL_empower_unions_desc:0 "During the days of yore the worker had no friend outside the unions, and the capitalist boss did everything he could to kick them down. Now however we have to options, to either merge them into a large state union, or pass laws protecting people's rights to join them."
 CAL_establish_pensions:0 "Establish Pensions"
 CAL_establish_pensions_desc:0 "We will pass three laws ensuring pensions for the disabled, widowed mothers with children, and those over sixty years of age, granted that they have lived in California for 3 years. This pension program will establish a saftey net and ensure that those most unable to care for themselves are watched out for."
 CAL_expose_big_bussiness:0 "Expose Big Business"
 CAL_expose_big_bussiness_desc:0 "We must show the public the great power corporations, and those of water, gas and telephone, railroads and city traction, with their enormous financial reserves, controlling credit and manipulating markets for the benefit of a little group of insiders."
 CAL_form_legal_committee:0 "Form Legal Committee"
 CAL_form_legal_committee_desc:0 "A committe of entrusted legal experts is to be assembled, their job to form the dozen laws which are to carry out the EPIC plan. They will have to stand scrutiny of the highest-priced capitalist lawyers in the State, and no doubt will have to run the gauntlet of the courts."
 CAL_georgist_ammendment:0 "Tax Unused Land"
 CAL_georgist_ammendment_desc:0 "We will add a constitutional amendment providing for a graduated land tax upon all unimproved building land and all agricultural land which is not under cultivation. The enabling act providing for this tax will contain exact and careful provisions to avoid evasion. The law will specify what constitutes cultivation, and will provide that crops must not merely be planted but must be harvested and used or sold. Improvements must bear a certain relation to the assessed valuation of the building sites. A valuable city lot will not be considered to be improved because a shack is hurriedly erected upon it, nor will thousands of acres of land be kept out of productive use because a million-dollar palace occupies a small part. Individual holdings assessed at less than $1000 will be exempted.\n\nThis will prevent capitalists from leaving perfectly developable land empty and unproductive, and force them either to sell it to those who will use it or improve it themselves."
 CAL_gold_fish_bowl:0 "Gold-Fish Bowl"
 CAL_golden_rule:0 "Golden Rule"
 CAL_golden_rule_desc:0 "You have been taught by harsh experience that the dogs have teeth, and that the devil has a sharp pitchfork. I ask you to try to forget those evil principles, and adjust ourselves to the idea of solidarity, friendship, and the Golden Rule."
 CAL_income_tax:0 "Tax the Rich"
 CAL_income_tax_desc:0 "We will establish a state income tax beginning with incomes of $5000 and steeply graduated until incomes of 50,000 pay %30 tax. This way the capitalist pays his fair share instead of forcing it upon the worker."
 CAL_kick_out_lobbyists:0 "Kick Out Lobbyists"
 CAL_kick_out_lobbyists_desc:0 "Despite our election there are still a significant amount of lobbyists fighting for corporate interests in the capital. Bribing politicans and forcing through laws with the sole motive of profit. No more, from here on out the public servants of the state will be as servants, living plainly, and if the corporations want to represent their interests they will have to argue their case just like anyone else."
 CAL_land_colonies_act:0 "Land Colonies Act"
 CAL_land_colonies_act_desc:0 "Our next job is to create the California Authority for Land, which will be empowered to exercise the right of eminent domain and condemn land required for colony purposes. It will be authorized to take over all land which has been sold or may in the future be sold for taxes, whether by cities or by counties, and to retain this land and put it to use… It will establish colonies, erect buildings, conduct all business operations, and make regulations for the governing of the colonies. It will be authorized to open stores for its members, and conduct a merchandising business.\n\nIn other words it will let us buy and take empty land and put farmers and unemployed on them to work for themselves, rather than for the bourgeoise."
 CAL_make_appointments:0 "Make Appointments"
 CAL_Make_appointments_desc:0 "One of our first orders of business is appointing officials to run executive functions of the government. While many are inexperienced for politicans, after years of campaigning the Governor-elect has acquired a knowledge of the men and women most devoted to the cause, and has decided which among them are best adapted to executive work.\nMany are coming to see him, wires are being sent, and appeals are being made."
 CAL_money_act:0 "Money Act"
 CAL_money_act_desc:0 "In order to pay for our ambitious program we need a radical change to the capitalist economy. The California Authority for Money will issue scrip for the porposes of CAL and CAP, these bodies in turn will use scrip to pay for goods and services. The CAM will also be authorized to issue bonds to the amount of three hundred million dollars to finance the operations of CAL and CAP. These bonds will be sold directly to the people without any commissions to bankers.\n\nIn otherwords, the CAM will be established to make sure we can pay for our ambitious economic programs."
 CAL_production_act:0 "Production Act"
 CAL_production_act_desc:0 "Next we must create the California Authority for Production. Which will be authorized to acquire factories by condemnation proceedings, to purchase those sold at foreclosure sales, and put these plants to productive use; To purchase raw materials, sell the finished products, erect buildings, make regulations, and to open stares and conduct a merchandising business.\n\nIn other words, we will take empty factories and give them to unemployed managers and factory workers to run."
 CAL_replace_sales_tax:0 "Burden Off the Consumer"
 CAL_replace_sales_tax_desc:0 "We will totally remove all sales tax. All this does is place the burden of taxes onto the working man, instead we will replace this outdated system with a tax on stock transfers at 4 cents per share."
 CAL_sinclair_elected:0 "Sinclair Elected"
 CAL_sinclair_elected_desc:0 "Upton Sinclair and his EPIC campaign has succeeded, bringing a socialist to the Governor's office in the first time in the states history. While this radical political upset which was aided greatly by the economic and political turmoil of the great collapse it may still be subsumed by it.\n\nMany worry that the radical path now embarked upon will lead the country into anarchy, or even worse tryanny."
 CAL_socialist_governor:0 "Sinclair Elected"
 CAL_socialist_governor_desc:0 "Upton Sinclair and his EPIC campaign has succeeded, bringing a socialist to the Governor's office in the first time in the states history. While this radical political upset which was aided greatly by the economic and political turmoil of the great collapse it may still be subsumed by it.\n\nMany worry that the radical path now embarked upon will lead the country into anarchy, or even worse tryanny."
 CAL_tax_code_ammendment:0 "Ammend the Tax Code"
 CAL_tax_code_ammendment_desc:0 "We will add a constitutional amendment revising the tax code of the State and providing that cities and counties shall exempt from taxation all homes occupied by their owners, and ranches cultivated by the owners, when the assessed value of such homes and ranches is less than $3,000. Assessments between $3,000 and $5,000 will pay a normal tax, as at present, and above $5,000, there will be an increase of one-half of one per cent for each $5,000 of additional assessed valuation. Similar provisions will be made for graduated taxes upon all other real property.\n\nThis will force many capitalists argicultural businesses to be unprofitable, forcing them to sell their land to those who actually work it, and bringing an equal society."
 CAL_tax_utilites:0 "Target Private Utilities"
 CAL_tax_utilites_desc:0 "Privately owned public utility corporations and banks, despite providing essential services endlessely try and extort the public. We must increase taxes on them in order to push them into bankruptcy and nationalisation."
 CAL_the_epic_plan:0 "The Epic Plan"
 CAL_the_epic_plan_desc:0 "Now that we have assembled a competent team within the government to carry out our ambitious reforms. We are going to be challenged on all sides. From the radicals who wish to go farther, from the centrists and reactionaries who think we go to far, and most of all the oligarchs whose capitalist order we threaten."
