 CAL_james_rolph_desc:0 "James Rolph was born ub August 23, 1869 in San Francisco. In 1911 he would run for mayor and win, an office he would hold for 19 years, and in which he would develop a friendly relationship with the cities white minorities and the Catholic church. During this time he developed a reputation as \"Sunny Jim\" for his upbeat and good-humored personality, and appeared as himself in a few films. Although despite his reputation for bubbliness he has helped protect and defend much of the violence ongoing in this state."
