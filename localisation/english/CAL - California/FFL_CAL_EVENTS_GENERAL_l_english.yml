l_english:
 california_events.1.a:0 "Start of a Revolution?"
 california_events.1.desc:0 "Longshoremen, that is, dockyard workers have begun a massive coordinated strike in California. Already the production on the waterfront of San Francisco and Las Angeles has ground to a halt, putting a terrible stranglehold on the most important hubs of our economy.\n    However what is equally concerning is the potential for this to spill over into even greater violence. Already there militant union has had multiple clashes with the police which could soon escalate into city wide violence.\n     Communist pamphlets are now being distributed openly, and socialists and agitators across the state are showing their support. It seems that until the situation changes neither the companies nor the workers are going to budge."
 california_events.1.t:0 "Waterfront Strike"
 california_events.2.a:0 "Send in the National Guard"
 california_events.2.b:0 "Do Nothing"
 california_events.2.desc:0 "Reports have come in after violence escalated during the ILA strike, with police using tear gas and mounted police to disperse picketers. The violence was long and contuining with the police dispersing the protestors multiple times and during the violence two men were shot and killed by the authorities.\n    Since then the strike has escalated to the entire city bringing all work to a screeching halt. An urgent response is required soon lest the strikes develop into open riots.\n    We have two options, we could either deploy the national guard to the city, an option that Frank Merriam is firmly against, for fear of ruining his reputation, or we could withhold the national guard, letting the situation develop without our initiative."
 california_events.2.t:0 "San Francisco Strike"
 california_events.3.a:0 "Nipping Socialism in the Bud"
 california_events.3.desc:0 "1,500 members of the national guard have been deployed to San Francisco, bringing an end to the strikes. The Governor waits nervously for news of further violence and chaos from the city, yet none ever comes. The waterfront remains empty, the streets desolate as they are patrolled by armed soldiers.\n    Despite initial fears that the strikes might ruin Merriam's reputation they have universally been applauded by the deeply conservative media industry.\n    Upton Sinclair and his newspaper have condemned the violence and extended their sympathies to the strikers, however most throughout the country breathe a sigh of relief as the economy begins to return to it's defunct status quo."
 california_events.3.t:0 "Success"
 california_events.4.a:0 "A Humiliation..."
 california_events.4.desc:0 "A massacre has occured in San Francisco today after the deployment of the national guard to said city has resulted in unparalleled violence. For multiple days communists, strikers, and even sympathetic guardsmen fought the state militia until it was ordered to retreat from the city.\n    Despite the use of cannons, tanks, and dozens of civilians dead the unions seem to have taken control of the city, at least for now. Frank Merriam's reputation is now in ruins, being ridiculed both by conservatives and democrats alike, while the situation in the city remains far from resolved."
 california_events.4.t:0 "Failure"
 california_events.5.a:0 "Things Are Getting Out of Hand"
 california_events.5.desc:0 "It has by now been confirmed beyond all doubt that the democratic government of San Francisco has been coup'd and socialists now governe the city. The strikes have been ended as the dockyards and industries of the city have been turned over to unions for self-production. Thousands now flee the city, fearing retribution and theft, while the police force has been dissolved.\n    To attempt to take the city by force now would only result in another massacre. At least for now, San Francisco will remain a commune."
 california_events.5.t:0 "Coup in San Francisco" 
 california_events.6.t:0 "Sinclair Wins"
 california_events.6.a:0 "Can't Make Everyone Happy"
 california_events.6.desc:0 "After almost two years of campaigning the first step of the EPIC plan has succeeded. California is now under the role of an explicitly socialist governor for the first time in it's history. However this is not a total victory. Conservatives, moderates, reactionaires, even businessmen still maintain power in the capital and it will be long years of bitter work for this to change. One only hopes that Upton Sinclair, a man with no experience whatsoever in politics, knows what he's doing.\n    At his inaguration cermony the elect has pledged to forgive and forget all the foul things the former governor has said and to start anew. Additionally he immediately pardoned Thomas J. Money, apologizing to him for the injustice done to him for the past eighteen years.\n    He went on to condemn capitalism and 'big business' and has called for the unselfish efforts of every true citizen to aid his plan. Many were shocked by his plain dress and his cancelation of any celebratory events usual after a successful election."
 california_events.7.t:0 "Strikers In Joaquin"
 california_events.7.desc:0 "Joaquin Valley produces more cotton per acre than the deep south, and all of this is done through cheap mexican and philippino labor. Multiple unions, most prominently the militant Cannery and Agricultural Worker's Industrial Union, have convened to organize a strike, demanding higher pay. Already things have turned violent as hundreds of families are evicted from the homes for participating in the strike\n   Thousands gather in camps leased by the unions, often outnumbering the neighboring towns. The local police and local government are firmly on the side of the growers, and have been aiding them in their all-out war against the strikers.\n   It seems that we have yet another strike to keep an eye on."
 california_events.7.a:0 "Add It To The List"
 california_events.8.t:0 "Pixley Murders"
 california_events.7.
 california_events.10.t:0 "Emboldend Strikers"
 california_events.11.b:0 "Put A Stop To It"
 california_events.11.a:0 "Offer Pardons"
 california_events.11.desc:0 "New from San Jose today as the heavily publicized kidnapping of Brooke Hart, a young businessman has ended in tragedy. Heir of one of California's best known businesses, L Hart & Son, well known for its phenomenal customer service, has been murdered after a shocking kidnapping.\n  However the story does not end here as already plans are being publicly made to lynch the suspected murderers. We could either endorse these plans, promising to pardon anyone involved, or we could condemn these plans putting a stop to them."
 california_events.11.t:0 "Murder of Brooke Hart"
 california_events.12.a:0 "A Nation of Laws?"
 california_events.12.desc:0 "News today as Thomas Thurmond and John M. Holmes, the killers of Brooke Hart have been lynched today by a mob. Scores of reporters, photographers, newsreel camera operators, and as many as 10,000 men, women, and children have born witness to the crime.\n    The newspapers have deliberately smudged all published photos to hide anyone identifiable, and as yet no arrests have even been attempted.\n   While many praise the decisive action and justice delivered this event signals an even deeper departure from law and order, where violence is being openly sanctioned by the authorities."
 california_events.12.t:0 "Is This Justice?"
 california_events.27.t:0 "Support From California"
 california_events.27.desc:0 "California has decided to send material aid to us. This will be a help to our efforts."
 california_events.27.a:0 "Finally, Good News..."