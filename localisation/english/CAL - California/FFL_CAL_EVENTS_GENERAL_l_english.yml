l_english:
 california_events.1.a:0 "Start of a Revolution?"
 california_events.1.desc:0 "Longshoremen, that is, dockyard workers have begun a massive coordinated strike in California. Already the production on the waterfront of San Francisco and Las Angeles has ground to a halt, putting a terrible stranglehold on the most important hubs of our economy.\n    However what is equally concerning is the potential for this to spill over into even greater violence. Already there militant union has had multiple clashes with the police which could soon escalate into city wide violence.\n     Communist pamphlets are now being distributed openly, and socialists and agitators across the state are showing their support. It seems that until the situation changes neither the companies nor the workers are going to budge."
 california_events.1.t:0 "Waterfront Strike"
 california_events.2.a:0 "Send in the National Guard"
 california_events.2.b:0 "Do Nothing"
 california_events.2.desc:0 "Reports have come in after violence escalated during the ILA strike, with police using tear gas and mounted police to disperse picketers. The violence was long and contuining with the police dispersing the protestors multiple times and during the violence two men were shot and killed by the authorities.\n    Since then the strike has escalated to the entire city bringing all work to a screeching halt. An urgent response is required soon lest the strikes develop into open riots.\n    We have two options, we could either deploy the national guard to the city, an option that Frank Merriam is firmly against, for fear of ruining his reputation, or we could withhold the national guard, letting the situation develop without our initiative."
 california_events.2.t:0 "San Francisco Strike"
 california_events.3.a:0 "Nipping Socialism in the Bud"
 california_events.3.desc:0 "1,500 members of the national guard have been deployed to San Francisco, bringing an end to the strikes. The Governor waits nervously for news of further violence and chaos from the city, yet none ever comes. The waterfront remains empty, the streets desolate as they are patrolled by armed soldiers.\n    Despite initial fears that the strikes might ruin Merriam's reputation they have universally been applauded by the deeply conservative media industry.\n    Upton Sinclair and his newspaper have condemned the violence and extended their sympathies to the strikers, however most throughout the country breathe a sigh of relief as the economy begins to return to it's defunct status quo."
 california_events.3.t:0 "Success"
 california_events.4.a:0 "A Humiliation..."
 california_events.4.desc:0 "A massacre has occured in San Francisco today after the deployment of the national guard to said city has resulted in unparalleled violence. For multiple days communists, strikers, and even sympathetic guardsmen fought the state militia until it was ordered to retreat from the city.\n    Despite the use of cannons, tanks, and dozens of civilians dead the unions seem to have taken control of the city, at least for now. Frank Merriam's reputation is now in ruins, being ridiculed both by conservatives and democrats alike, while the situation in the city remains far from resolved."
 california_events.4.t:0 "Failure"
 california_events.5.a:0 "Things Are Getting Out of Hand"
 california_events.5.desc:0 "It has by now been confirmed beyond all doubt that the democratic government of San Francisco has been coup'd and socialists now governe the city. The strikes have been ended as the dockyards and industries of the city have been turned over to unions for self-production. Thousands now flee the city, fearing retribution and theft, while the police force has been dissolved.\n    To attempt to take the city by force now would only result in another massacre. At least for now, San Francisco will remain a commune."
 california_events.5.t:0 "Coup in San Francisco" 
 california_events.6.t:0 "Sinclair Wins"
 california_events.6.a:0 "Can't Make Everyone Happy"
 california_events.6.desc:0 "After almost two years of campaigning the first step of the EPIC plan has succeeded. California is now under the role of an explicitly socialist governor for the first time in it's history. However this is not a total victory. Conservatives, moderates, reactionaires, even businessmen still maintain power in the capital and it will be long years of bitter work for this to change. One only hopes that Upton Sinclair, a man with no experience whatsoever in politics, knows what he's doing.\n    At his inaguration cermony the elect has pledged to forgive and forget all the foul things the former governor has said and to start anew. Additionally he immediately pardoned Thomas J. Money, apologizing to him for the injustice done to him for the past eighteen years.\n    He went on to condemn capitalism and 'big business' and has called for the unselfish efforts of every true citizen to aid his plan. Many were shocked by his plain dress and his cancelation of any celebratory events usual after a successful election."
 california_events.7.t:0 "Strikers In Joaquin"
 california_events.7.desc:0 "Joaquin Valley produces more cotton per acre than the deep south, and all of this is done through cheap mexican and philippino labor. Multiple unions, most prominently the militant Cannery and Agricultural Worker's Industrial Union, have convened to organize a strike, demanding higher pay. Already things have turned violent as hundreds of families are evicted from the homes for participating in the strike\n   Thousands gather in camps leased by the unions, often outnumbering the neighboring towns. The local police and local government are firmly on the side of the growers, and have been aiding them in their all-out war against the strikers.\n   It seems that we have yet another strike to keep an eye on."
 california_events.7.a:0 "Add It To The List"
 california_events.8.t:0 "Pixley Murders"
 california_events.8.desc:0 "The cotton strikes in Joaquin were violent from the start but now they are starting to escalate into full on warfare. Early this morning ranchers and policement surronded a group of strikers, resulting in a shoot out between the two groups. Several dead and even more are injured.\n   The most significant outcome of this has been and outpouring of sympathy for the strikers from the general Californian public. Action is demanded unless we wish to look like absolute fools.\n   We have two options. We can either attempt to negotiate with the strikers, while the growers will not agree to a pay increase we can offer monetary aid on the condition they return to work. Alternatively we could disarm the strikers, effectively leaving them defenless to further acts of violence, but protecting the growers' cotton and those still working. Either option is acceptable as long as it leads to an end in violence."
 california_events.8.a:0 "Negotiate"
 california_events.8.b:0 "Disarm the Workers"
 california_events.9.t:0 "Negotiations Success"
 california_events.9.desc:0 "Negotiations with the striking cotton workers have come to a success, greatly aided by the efforts of George Creel. In exchange for the cotton workers returning to the status quo they will recieve monetary aid unconditionally.\n   Despite this solution being generally unpopular with the strikers themselves, the leaders of the CAWIU have agreed to it. Things return to normal in the valley, at least for now."
 california_events.9.a:0 "Alright, Back  to Work!"
 california_events.10.t:0 "Negotiations Failures"
 california_events.10.desc:0 "Despite our best attempts negotiations have failed to come to any meaningful compromise. The vast majority of the pickers support continuining the strikes, and the violence and mistreatment has only hardend the resolves of the CAWIU leadership.\n   While multiple officials put up an impressive effort to end the strikes it seems that we will now have to resort to force, as it is unnaceptable for our reputation if the violence is too continue."
 california_events.10.a:0 "Compromise Isn't Always A Solution"
 california_events.11.b:0 "Put A Stop To It"
 california_events.11.a:0 "Offer Pardons"
 california_events.11.desc:0 "New from San Jose today as the heavily publicized kidnapping of Brooke Hart, a young businessman has ended in tragedy. Heir of one of California's best known businesses, L Hart & Son, well known for its phenomenal customer service, has been murdered after a shocking kidnapping.\n  However the story does not end here as already plans are being publicly made to lynch the suspected murderers. We could either endorse these plans, promising to pardon anyone involved, or we could condemn these plans putting a stop to them."
 california_events.11.t:0 "Murder of Brooke Hart"
 california_events.12.a:0 "A Nation of Laws?"
 california_events.12.desc:0 "News today as Thomas Thurmond and John M. Holmes, the killers of Brooke Hart have been lynched today by a mob. Scores of reporters, photographers, newsreel camera operators, and as many as 10,000 men, women, and children have born witness to the crime.\n    The newspapers have deliberately smudged all published photos to hide anyone identifiable, and as yet no arrests have even been attempted.\n   While many praise the decisive action and justice delivered this event signals an even deeper departure from law and order, where violence is being openly sanctioned by the authorities."
 california_events.12.t:0 "Is This Justice?"
 california_events.21.t:0 "Accept Seccession?"
 california_events.21.desc:0 "We have recieved unfortunate news that Jefferson, the long anarchic section of our state has scrambled enough of a militia to try and declare seccession from California. While this comes at an awkard time and we do not have the resources to spare waging a guerrilla war in the mountains, accepting their seccession would undermine the fundamental integrity of our state?\n   If Jefferson can secede, why not Sinclair? Ultimately the choice is up to us."
 california_events.21.a:0 "Invasion It Is"
 california_events.21.b:0 "Let them Secede"
 california_events.22.t:0 "Unity in Jefferson"
 california_events.22.desc:0 "Of the dozens of ragtag groups and militias now vying for domination over Jefferson, there is only one thing they all have in common, a hatred of the Sacramento government and a wish for an independnet Jefferson. While previously a rather fringe and obscure movement, relevant in only small parts of the region, the chaos of the great collapse and the lack of stability provided by a central government have now brought it into the dominant political force in the region.\n   These militias will still largely unorganized have begun actively coordinating to prevent military intervention in the area, and the larger of these have begun governing large sections of the region by themselves.\n   Meanwhile hundreds still flee for safer harbors, and the inevitable war that seems to be brewing."
 california_events.22.a:0 "Spiraling Out Of Control..."
 california_events.24.t:0 "Jefferson In Chaos"
 california_events.24.desc:0 "The northern most region of California has long been one neglected by progress and investment, stemming back to the earliest days of the Gold Rush is has made multiple attempts to secede. Now in the wake of the great collapse it has been hit harder than any other region of California.\n   In many places the police are simply not paid, the roads are never repaired, and while most of California has remained stable, Jefferson has long since been sliding into anarchy. Gangs, private militias, and even communists battle each other in the Cascades mountains and patrol the roads, making them as unusable as if they were washed out.\n   However there are no resources to devote to this struggling region as the rest of California begins a similiar descent. They will have to get through this on their own."
 california_events.24.a:0 "Long Neglected"
 california_events.25.t:0 "The Question of Jefferson"
 california_events.25.desc:0 "Thousands now flee the northern most reaches of California as the threat of anarchy in the region is now realized. Local city councils no longer hold any power as seccesionist, communist, and even fascist militias now hold entire towns hostage. The chaos has gotten so bad that most connection with the outside world has been completely severed, and all trade passing through the region has ceased.\n   Fears of revolution closer to home and stoking even more violence have prevented the deployment of the thinly stretched national guard to the region so far, but now it might be time to consider deploying more forces to the region."
 california_events.25.a:0 "Deploy National Guard"
 california_events.25.b:0 "Do Nothing"
 california_events.26.t:0 "The Governor"
 california_events.26.desc:0 "James Rolph was bent over his desk, reading the latest reports. It was nearly 3 A.M. and he was still making calls, ordering reports, signing documents. He didn't normally work this late, but nowadays he never even slept in his own bed, instead sleeping inside his own office.\n   The great collapse had sent California spiraling into near chaos. Everyday there was some new report of violence, some new red or brown or green or orange scare, he'd lost track. His secretary came in to tell him that Patton was calling him. James Rolph put on a big smile as if he was excited to recieve news from the general but inside he cursed.\n   As soon as he picked up the phone George S. Patton was angrily muttering expletives into his ear. Rolph nodded, approved the funds the general needed and set the phone down. He rubbed his eyes, and suddenly bent stood up, one hand on the desk, the other clutching his heart.\n   He should really see a doctor about it but he just didn't have the time. He waited until the pain subsided and got back to work."
 california_events.26.a:0 "A Sunny Man For A Sunny State"
 california_events.27.t:0 "Support From California"
 california_events.27.desc:0 "California has decided to send material aid to us. This will be a help to our efforts."
 california_events.27.a:0 "Finally, Good News..."
 california_events.28.t:0 "Local Governments Being Couped"
 california_events.28.desc:0 "All across the country local governments are being couped. While many of these are being done by cooperatives, sinclairists, and even unions, just as many if not more are being done by radical anti-communists. In Joaquin over three dozen cotton growers armed with machine guns, backed by the police, took control of the town center and wrote a declaration saying they would revolt against Sinclair if elected.\n   In San Francisco over five hundred armed union workers repeated a similiar coup. Across America and the world observers all conclude the same thing..."
 california_events.28.a:0 "The Bear Republic Is Dying..."
 california_events.29.t:0 "Wars Offical"
 california_events.29.desc:0 "If the Californian republic was a play this would be the final scene of the first act, as the Sacramento government has officially declared war on the rival Las Angeles government. Never since the first revolution has the future of the bear republic been so uncertain, whether democratic forces will prevail or it will fall to tryanny in anyones guess.\n   The state once compared to Eden has now suffered it's same fate, they have been kicked from the garden and sent into the desert."
 california_events.29.a:0 "Can There Be Any Returning?"
 california_events.30.t:0 "Democratic Convention"
 california_events.30.desc:0 "The Democratic convention to determine who should be the nominee for the 1934 gubernatorial ticket. In a surprising political upset, Upton Sinclair has won overwhemingly, winning more than the rest of the candidates combined.\n   What this means is that for the next couple months the Democrat party machinery will serve to deliver a socialist into the presidency.\n   Less significantly Upton Sinclair has been kicked from the Socialist Party of America, due to their strict rules on running for other parties. However this move has essentially destroyed the party within California as Sinclair takes the moderates with him."
 california_events.30.a:0 "They Played Themselves"
 california_events.31.t:0 "Disarm the Workers" 
 california_events.31.desc:0 "What has initially begun as an initiative by the governor to end the violence in the San Joaquin valley has only escalated. While the guardsmen, police, and the growers cooperated in order to disarm the militant and armed cotton strikers, multiple resisted.\n   Later some of the growers, and highway patrolmen using a machinegun mounted on their vechile, participated in the roundup and massacre of dozens of these strikers.\n   Public opinion is largely horrified however the local strikes have been definitively broken, and any threat of insurgency or militant act from them has been quashed."
 california_events.31.a:0 "Brute Force"
 california_events.32.t:0 "No One Likes Merriam"
 california_events.32.desc:0 "The unfortunate truth is that no one likes Frank Merriam. Despite serving as the lieutenant governor for almost three years and having a long career in politics before that, he has yet to make that favorable and impression on the Californian public.\n   What he does have however is powerful backing from the conservative establishment that has held control of California for over 40 years. Even despite his own unpopularity he is still the most likely to win."
 california_events.32.a:0 "Who Else Is Running?"
 california_events.32.b:0 "He's Got My Vote!"
 california_events.33.t:0 "Collectives Arming Themselves"
 california_events.33.desc:0 "Since the start of the great depression hundreds of thousands of farmers in California have found themselves unemployed, many of them have formed communities, giant tent cities and Hoovervilles in which limited shelter, protection, and oppurtunity is provided. The economy of these collectives is medieval, often relying solely on bartering, but they also provide immense amounts of community support to their members.\n   As the situation in California spirals even further out of control, these communities have begun arming themselves as never before. Building earthworks, buying machineguns, and forming large organized militias. This is not without reason, as they have increasingly been victims of violence attack, by police, gansters, and even other militias, and it is well within their rights to defend themselves."
 california_events.33.a:0 "At Least They Can Rely On Each Other..."
 california_events.34.t:0 "Vitrolic Attacks On E.P.I.C."
 california_events.34.desc:0 "The attacks on Upton Sinclair and his supporters has begun to reach absurd levels. Every day there is another newsreel accusing Sinclair of being a socialist, of Soviet interference, of a coup being planned. Endlessly lies are thrown against the man, oftentimes quoting characters from his books, to make Sinclair appear more radical and dangerous.\n   These violent attacks have already begun spilling over into real life, every day another union leader is shot, or another militia skirmish.\n   Meanwhile the police and government themselves have been little help, often tacticly encouraging the violence and protecting anti-communist thugs from reprecussion. One can only hope that the upcoming election will put an end to this for good."
 california_events.34.a:0 "This Leads Nowhere Good..."
 california_events.35.t:0 "Terror Against Orientals"
 california_events.35.desc:0 "One of the more unfortunate victims of the rising stem of violence has been Asians, long subjects of violence and discrimination in California. Now the violence that died down in the 1890s has come back into the force, and the Asian Exclusion League has been experiencing an all-time high of membership. Multiple officials have begun riding this wave of discrimination, decrying the 'yellow peril' that has been threatening to coup California and turn it into a loyal vassal of the Japanese Emperor.\n   Already in many cities curfews have been established for those of Asian descent, and laws passed forcing them to report themselves as such. Evictions without notice, open violence, lynchings, and even explusions from cities, have become common place.\n   Can they even..."
 california_events.35.a:0 "...Find Japan on a Map?"
 california_events.36.t:0 "Mayoral Election of Las Angeles"
 california_events.36.desc:0 "The city of Los Angeles is by far the most important and populous of all California, therefore the politics of this city are incredibly important. \n   There are four major candidates running, and each has about an equal chance of winning.  The first is Frank L. Shaw, a large property owner and employer in Los Angeles, who has been accused of corruption and intimidation of his workers.\n   The second is John Clinton Porter, the incumbent, a xenophobic protestant populist, and member of the Klu Klux Klan.\n   The third is George E. Cryer, a loyal republican, who styles himself an efficient non-politican who will clean up corruption.\n   The final candidate is Charles W. Dempster, sympathetic to unions and Sinclair, but with a history of violence, his election would be a radical political upset."
 california_events.36.a:0 "Frank L. Shaw"
 california_events.36.b:0 "John Clinton Porter"
 california_events.36.c:0 "George E. Cryer"
 california_events.36.d:0 "Charles W. Dempster"
 california_events.37.t:0 "Patton Intervenes"
 california_events.37.desc:0 "The final nail has been hammered into the republics coffin today, as George S. Patton has publicly declared that the army is violently against Sinclair's 'jewocracy'. As blatant a breaking of democracy as this is it is unclear exactly were Merriam is in all of this.\n   Despite Pattons disinterest in politics, it is unclear whether or not this is a military coup, or the military backing Merriam's coup.\n   One thing is certain however, the cooperatives, unions, and even socialist militias are well armed, and are prepared to fight.\n   Upton Sinclair has issued a statement of his own warning that unless he is accepted into office they will all be powerless to stop a violent workers revolution.\n   While civil war is inevitable, one thing is not, does Merriam stay?"
 california_events.37.a:0 "Merriam Stays"
 california_events.37.b:0 "Patton Goes Alone"
 california_events.38.t:0 "George Creel Assassinated"
 california_events.38.desc:0 "George Creel, a prominent democrat and figure in the San Joaquin strikes, was killed during a car bombing earlier this morning. As the main champion of the standard Democratic Party line, and the party favorite. Now that he is dead it is garaunteed that  his fellow writer Upton Sinclair, the popular socialist will win the party ticket.\n   A good man the golden state mourns another victim of escalating political violence."
 california_events.38.a:0 "He Never Would've Won Anyways"
 california_events.39.t:0 "Long Beach Earthquake"
 california_events.39.desc:0 "A deasting earthquack has occured south of downtown Los Angeles, destroying dozens of schools, and killing over a hundred. Damage is widespread throughout all of southern California, but the most damage is in the Long Beach area. Already there is outrage from the media as to why school buildings suffered such disproportionate damage and an investigation has already been launched. However there is still plenty of blame to be passed around for the lack of preparation in a known fault line."
 california_events.39.a:0 "Shoddy Union Workers"
 california_events.39.b:0 "Republican Corruption"
 california_events.41.t:0 "Moderates Turn To Haight"
 california_events.41.desc:0 "Following the democratic parties nomination of Sinclair many moderate and more centrist democrats have begun turning to Haight's Commonwealth Progressive ticket. All this has does for us is siphon votes away from the democratic nomination and put another nail in the coffin of the democratic party."
 california_events.41.a:0 "They Were Pretty Useless Anyways"
 california_events.42.t:0 "Our Industrial Connections"
 california_events.42.desc:0 "The press and industry leaders of California are incredibly conservative and are more than willing to lend us favors. We are desperately in need both of building up our arms manufacturing and of shoring up support. By having them build these new factories in a certain area we could help secure their support for us in critical areas.\n   While we could never win over Las Angeles or San Francisco, the cesspools of bolshevism that they are, Oakland and San Diego are both different stories. Both options have there cons and benefits but in the end it's ultimately up to us."
 california_events.42.a:0 "Oakland"
 california_events.42.b:0 "San Diego"
 california_events.43.t:0 "Gubernatorial Elections Announced"
 california_events.43.desc:0 "News from Sacramento as a bill proposed by the incumbent, that would set elections to be held in November, a year early, has passed through the congress near unanimously.\n   Already dozens of candidates have announced their plans to run but already three seem to be coming to the forefront, each representing a different force in California's politics.\n   The first is Frank Merriam, the most likely conservative candidate and lieutenant Governor of California. Riding on the deeply ingrained conservatism and anti-communism of the states voters, he represents for many the political establishment and status quo.\n   The second is Upton Sinclair, the perennial socialist, this time running for the Democratic nomination. His supporters seek an urgent and radical change, but even they fear of a communist takeover of the movement.\n   And the final is Raymond L. Haight, a third party progressive candidate whose chances do not look good. His supporters are made up of the moderates and centrists on all sides, but without the Republican or Democratic parties backing his chances do not look good."
 california_events.43.a:0 "Tell Me About Merriam"
 california_events.43.b:0 "Tell Me About Sinclair"
 california_events.43.c:0 "Tell Me About Haight"
 california_events.43.d:0 "I Already Know Who I'm Voting For"
 california_events.44.t:0 "An Old Muckraker"
 california_events.44.desc:0 "There is much to say about Upton Sinclair. A famous American author, a perrenial socialist candidate in California's elections.\n   Sinclair has not gone into this election either expecting nor hoping to win, as campaigning and governorship would take all his time away from his real lifes passion, writing. However he has a radical plan to end poverty and widespread support, however many fear he will destroy their liberties and property in the process.\n   His support does not mainly come from socialists, but rather from progressives and those who seek moderate economic intervention into the economy to help alleviate the great depression. Most of his support is massed in urban areas, Las Angeles and San Francisco in particular.\n   It is also worth noting that he is not popular among minorities or blacks."
 california_events.44.a:0 "Who Else Is Running?"
 california_events.44.b:0 "He's Got My Vote!"
 california_events.45.t:0 "The Third One"
 california_events.45.desc:0 "Raymond L. Haight is the perhaps the most moderate member running in this race. Involved in both the progressive and conservative spheres he has ingratiated himself with the moderates on both sides, and now leads a third party movement in a hopeful bid for the presidency.\n   A successful lawyer known for investigating corporations, he is appealing to those more centrist of Sinclairs and Merriams base. However without the backing of any major political parties it is unlikely that he'll win any election."
 california_events.45.a:0 "Who Else Is Running?"
 california_events.45.b:0 "He's Got My Vote!"
 california_events.46.t:0 "Death Spiral"
 california_events.46.desc:0 "Following the great collapse the government has begun entering a death spiral for one simple reason, that the U.S. currency is now useless. With the U.S. dollar now almost worthless the state has nothing to pay is civil workers, police force, or even to provide federal aid for its people. Despite the governments attempts to stabilize the currency and promises to respect it is seems that nothing can stop the dollars freefall.\n   In this total chaos local communities have been forced to provide protection and charity for themselves without the aid of the U.S. government. Militias have now popped up all across the country, unpaid and often filled with former policement and veterans to help keep the peace.\n   While this has not caused any problems yet, it may if California becomes poliitcally divided."
 california_events.46.a:0 "Good People"
 california_events.47.t:0 "News Lows!"
 california_events.47.desc:0 "Following the great collapse the Californian economy has gotten ever worse, triggering a new series of bankruns, business failings, and layoffs. Unemployment has begun resurging past it's former low of 28 percent and tens of thousands of Californians find themselves without any reprieve.\n   Public order in cities has begun to collapse and crime has started rising dramatically. Many have lost hope of the situation ever improving and have started looking to radical solutions. Regardless, the situation does not seem like it'll start improving anytime soon, it gets worse..."
 california_events.47.a:0 "... Before It Gets Better"
 california_events.48.t:0 "Three Inagurations"
 california_events.48.desc:0 "Today in california three governors are being inagurated, one in Jefferson, one in Sacramento and one in L.A. each one claiming to be the only legitimate candidate.\n   The election saw incredible amounts of voter intimidation, fraud, and outright political violence, with no sides agreeing to recognize it's results. To many it seems that this is the final straw in a civil war."
 california_events.48.a:0 "The Greeks Warned Us"


