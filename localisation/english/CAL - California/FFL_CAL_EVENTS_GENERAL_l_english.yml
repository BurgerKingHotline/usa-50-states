 california_events.27.t:0 "A Region Long Neglected"
 california_events.27.desc:0 "The northern most region of California has long been one neglected by progress and investment, stemming back to the earliest days of the Gold Rush is has made multiple attempts to secede. Now in the wake of the great collapse it has been hit harder than any other region of California.\n      In many places the police are simply not paid, the roads are never repaired, and while most of California has remained stable, Shasta has long since been sliding into anarchy. Gangs, private militias, and even communists battle each other in the Cascades mountains and patrol the roads, making them as unusable as if they were washed out.\n      However there are no resources to devote to this struggling region as the rest of California begins a similiar descent. They will have to get through this on their own."
 california_events.27.a:0 "Spare No Expense"
 california_events.27.b:0 "We Have Other Problems"
 california_events.28.t:0 "DEFUNCT"
 california_events.28.desc:0 "DEFUNCT"
 california_events.28.a:0 "DEFUNCT"
 california_events.29.t:0 "Patton Intervenes"
 california_events.29.desc:0 "The final nail has been hammered into the republics coffin today, as George S. Patton has publicly declared that the army is violently against Sinclair's 'jewocracy'. As blatant a breaking of democracy as this is it is unclear exactly were Merriam is in all of this.\n      Despite Pattons disinterest in politics, it is unclear whether or not this is a military coup, or the military backing Merriam's coup.\n      One thing is certain however, the cooperatives, unions, and even socialist militias are well armed, and are prepared to fight.\n      Upton Sinclair has issued a statement of his own warning that unless he is accepted into office they will all be powerless to stop a violent workers revolution."
 california_events.29.a:0 "Merriam Stays"
