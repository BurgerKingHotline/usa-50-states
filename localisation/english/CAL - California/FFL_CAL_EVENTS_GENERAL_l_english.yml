 california_events.36.t:0 "The Governor"
 california_events.36.desc:0 "James Rolph was bent over his desk, reading the latest reports. It was nearly 3 A.M. and he was still making calls, ordering reports, signing documents. He didn't normally work this late, but nowadays he never even slept in his own bed, instead sleeping inside his own office.\n   The great collapse had sent California spiraling into near chaos. Everyday there was some new report of violence, some new red or brown or green or orange scare, he'd lost track. His secretary came in to tell him that Patton was calling him. James Rolph put on a big smile as if he was excited to recieve news from the general but inside he cursed.\n   As soon as he picked up the phone George S. Patton was angrily muttering expletives into his ear. Rolph nodded, approved the funds the general needed and set the phone down. He rubbed his eyes, and suddenly bent stood up, one hand on the desk, the other clutching his heart.\n   He should really see a doctor about it but he just didn't have the time. He waited until the pain subsided and got back to work."
 california_events.36.a:0 "A Sunny Man For A Sunny State"
 california_events.37.t:0 "An Old Muckraker"
 california_events.37.desc:0 "There is much to say about Upton Sinclair. A famous American author, a perrenial socialist candidate in California's elections.\n   Sinclair has not gone into this election either expecting nor hoping to win, as campaigning and governorship would take all his time away from his real lifes passion, writing. However he has a radical plan to end poverty and widespread support, however many fear he will destroy their liberties and property in the process.\n   His support does not mainly come from socialists, but rather from progressives and those who seek moderate economic intervention into the economy to help alleviate the great depression. Most of his support is massed in urban areas, Las Angeles and San Francisco in particular.\n   It is also worth noting that he is not popular among minorities or blacks."
 california_events.37.a:0 "Who Else Is Running?"
 california_events.37.b:0 "He's Got My Vote!"
 california_events.38.t:0 "Republican Midterms"
 california_events.38.desc:0 "Republican Midterms"
 california_events.38.a:0 "Republican Midterms"
 california_events.39.t:0 "The Third One!"
 california_events.39.desc:0 "Raymond L. Haight is the perhaps the most moderate member running in this race. Involved in both the progressive and conservative spheres he has ingratiated himself with the moderates on both sides, and now leads a third party movement in a hopeful bid for the presidency.\n   A successful lawyer known for investigating corporations, he is appealing to those more centrist of Sinclairs and Merriams base. However without the backing of any major political parties it is unlikely that he'll win any election."
 california_events.39.a:0 "Who Else Is Running?"
