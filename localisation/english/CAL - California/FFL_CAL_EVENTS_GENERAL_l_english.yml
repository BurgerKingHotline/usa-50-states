 california_events.1.t:0 "Mayoral Election of Las Angeles"
 california_events.1.desc:0 "The city of Los Angeles is by far the most important and populous of all California, therefore the politics of this city are incredibly important. \n      There are four major candidates running, and each has about an equal chance of winning.  The first is Frank L. Shaw, a large property owner and employer in Los Angeles, who has been accused of corruption and intimidation of his workers.\n      The second is John Clinton Porter, the incumbent, a xenophobic protestant populist, and member of the Klu Klux Klan.\n      The third is George E. Cryer, a loyal republican, who styles himself an efficient non-politican who will clean up corruption.\n   The final candidate is Charles W. Dempster, sympathetic to unions and Sinclair, but with a history of violence, his election would be a radical political upset."
 california_events.1.a:0 "Frank L. Shaw"
 california_events.1.b:0 "John Clinton Porter"
 california_events.1.c:0 "George E. Cryer"
 california_events.1.d:0 "Charles W. Dempster"
 california_events.2.t:0 "Long Beach Earthquake"
 california_events.2.desc:0 "A deasting earthquack has occured south of downtown Los Angeles, destroying dozens of schools, and killing over a hundred. Damage is widespread throughout all of southern California, but the most damage is in the Long Beach area. Already there is outrage from the media as to why school buildings suffered such disproportionate damage and an investigation has already been launched. However there is still plenty of blame to be passed around for the lack of preparation in a known fault line."
 california_events.2.a:0 "Shoddy Union Workers"
 california_events.2.b:0 "Republican Corruption"
 california_events.3.t:0 "News Lows!"
 california_events.3.desc:0 "Following the great collapse the Californian economy has gotten even worse, triggering a new series of bankruns, business failings, and layoffs. Unemployment has begun resurging past it's former low of 28 percent and tens of thousands of Californians find themselves without any reprieve.\n      Public order in cities has begun to collapse and crime has started rising dramatically. Many have lost hope of the situation ever improving and have started looking to radical solutions. Regardless, the situation does not seem like it'll start improving anytime soon, it gets worse..."
 california_events.3.a:0 "... Before It Gets Better"
 california_events.4.desc:0 "New from San Jose today as the heavily publicized kidnapping of Brooke Hart, a young businessman has ended in a shocking murder. Heir of one of California's best known and best liked businesses, L Hart & Son, well known for its phenomenal customer service.\n      Plans are being made to lynch the two accused, a tradition that has still has deep roots here. We could offer pardons to anyone convicted, this is what James Rolph would do personally and would boost conservative popularity, or we could publicly condemn them preserving the rule of law. However, it is already probably too late for the latter."
 california_events.4.a:0 "They Deserve It"
 california_events.4.b:0 "We're A Nation of Laws"
 california_events.4.t:0 "Murder of Brooke Hart"
 california_events.12.a:0 "Meh... GUILTY!"
 california_events.12.desc:0 "News today as Thomas Thurmond and John M. Holmes, the killers of Brooke Hart have been lynched today by a mob. Scores of reporters, photographers, newsreel camera operators, and as many as 10,000 men, women, and children have born witness to the crime.\n      The newspapers have deliberately smudged all published photos to hide anyone identifiable, and as yet no arrests have even been attempted.\n   While many praise the decisive action and justice delivered this event signals an even deeper departure from law and order, where violence is being openly sanctioned by the authorities."
 california_events.12.t:0 "Is This Justice?"
 california_events.5.t:0 "Coup in San Francisco" 
 california_events.6.t:0 "Question of the Military Budget"
 california_events.6.desc:0 "James Rolph was bent over his desk, reading the latest reports. It was nearly 3 A.M. and he was still making calls, ordering reports, signing documents. He didn't normally work this late, but nowadays he never even slept in his own bed, instead sleeping inside his own office.\n      The great collapse had sent California spiraling into near chaos. Everyday there was some new report of violence, some new red or brown or green or orange scare, he'd lost track. His secretary came in to tell him that Patton was calling him. James Rolph put on a big smile as if he was excited to recieve news from the general but inside he cursed.\n      As soon as he picked up the phone George S. Patton was angrily muttering expletives into his ear. Rolph nodded, as the General grumbled on and on about needing a bigger budget, more guns, and tanks. Always tanks! He rubbed his eyes, suddenly he stood up, bent over one hand on the desk, the other clutching his heart.\n      He should really see a doctor about it but he just didn't have the time. He waited until the pain subsided and took another look at the papers in front of him. The situation was dire, and resources limited. He could either approve a larger military budget as Patton suggested, much of the Republic lay without any federal authority, a larger military would mean more of the country controlled, less violence and crime, and more innocents protected.\n      Alternatively however he could spend the budget on providing emergency aid to the states' citizens. Countless people now added to the fifth of Californians jobless and destitute could be saved, simply by a government check. Ultimately the choice was up to him."
 california_events.6.a:0 "We Need A Large Military"
 california_events.6.a:0 "The People Need Help"
 california_events.7.t:0 "A German Diplomat"
 california_events.7.desc:0 "Georg Glyssing, a member of the Nazi party and a diplomat of Germany has just arrived in California. Officially as a German diplomat and vice-consul to Los Angeles. The charismatic married consul, always with a beautiful woman on his arm, has already begun intergrating himself into the local social scene."
 california_events.7.a:0 "Should I Care?"
 california_events.8.t:0 "DEFUNCT"
 california_events.8.desc:0 "DEFUNCT"
 california_events.8.t:0 "DEFUNCT"
 california_events.9.t:0 "Nazis Here?!"
 california_events.9.desc:0 "The Californian Friends of New Germany has just concluded it's first meeting in Los Angeles. It is an openly Nazi and fascistic organization, backed by Hitler with the purposes of facilitating fascism and closer ties to Germany.\n      While this is concerning to many, particularly the considerable Jewish population of the L.A. area, it's membership is rather small, mostly consisting of German immigrants with Nazi backgrounds."
 california_events.9.t:0 "Nazi In Hollywood"
 california_events.9.desc:0 "Georg Glyssing, the Nazi diplomat lay seated comfortably in his chair, across from him was seated Joseph Breen. As head of the National Legion of Decency, he had taken it upon himself to enforce the picture industry's self-censorship standards through boycotts and protests. While not a Hollywood man, he could still kill Hollywood movies.\n      'So you want me to kill this Madolf Mitler film huh? I think I could do that.' Breen chuckled. 'But I'm not sure I can prevent movies from using Jewish actors, or portraying all Germans as upstanding folk. I would if I could but you know who runs Hollywood.'\n      'Any help at all is appreciated Mr. Breen. I've already met with hundred of Hollywood publishers and executives at this point, all that's needed is a little public pressure to convince them that I'm right.'\n      'I know you're right. I've always said their is a strong pro-German antisemitic feeling in this country and it's time those degenerates heard of it.'\n      After shaking hands and leading Breen out of his office, Georg collapsed in his chair and stared at the ceiling. He hated his job. He wasn't even antisemitic really, but with that stupid Schwinn gunning for his job he couldn't afford even a single movie making it past Goebbels criterion."
 california_events.9.a:0 "Another day..."
