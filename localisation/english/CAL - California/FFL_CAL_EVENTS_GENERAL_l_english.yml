l_english:
 california_events.1.a:0 "Could This Be the Start of a Revolution?"
 california_events.1.desc:0 "Longshoremen in every U.S. coast have walked out of every U.S. port in a strike organized by the International Longshoresmen. The organization has multiple demands, including more mmen on each gang, lighter loads, and an independent union.\n    Until the strike is resolved our ports will be left empty and unmanned essentially bringing the already sunken economy to a screeching halt. Already the strikers have recieved outpourings of sympathy from other workers, while many conservatives call for greater crackdowns.\n    Even though the number of socialists and communists involved is rather poportionally small, we should be careful lest these strikes spill over into even greater violence."
 california_events.1.t:0 "Waterfront Strike"
 california_events.2.a:0 "Send in the National Guard"
 california_events.2.b:0 "Meet Their Demands"
 california_events.2.c:0 "Try to Negotiate"
 california_events.2.desc:0 "Reports have come in after violence escalated during the ILA strike, with police using tear gas and mounted police to disperse picketers. The violence was long and contuining with the police dispersing the protestors multiple times and during the violence two men were shot and killed by the authorities.\n    Since then the strike has escalated to the entire city bringing all work to a screeching halt. An urgent response is required soon lest the strikes develop into open riots.\n    We have three options, we could either send in the national guard to break up the riots for good, we could cave into their demands, or we could negotiate. Keep in mind that the conservative elements will favor a harsher reaction."
 california_events.2.t:0 "San Francisco Strike"
 california_events.3.a:0 "Nipping Socialism in the Bud"
 california_events.3.desc:0 "1,500 members of the national guard have been deployed to San Francisco, bringing an end to the strikes. The Governor waits nervously for news of further violence and chaos from the city, yet none ever comes. The waterfront remains empty, the streets desolate as they are patrolled by armed soldiers.\n    Despite initial fears that the strikes might ruin Merriam's reputation they have universally been applauded by the deeply conservative media industry.\n    Upton Sinclair and his newspaper have condemned the violence and extended their sympathies to the strikers, one only hopes his message does not resonate with too many others."
 california_events.3.t:0 "National Guard San Francisco"
 california_events.4.a:0 "Indecision is a Decision"
 california_events.4.desc:0 "Our decision to not intervene in the strikes has unsurprisingly resulted in San Francisco government caving into the demands of the strikers, essentially unionizing the entire Californian longshoremen industry. \n    While unionists and socialists across the country celebrate this achievement conservatives are already tearing into Merriam for his weak response. Already unions all across America have been emboldend and more strikes are expected to come."
 california_events.4.t:0 "Do Nothing"
 california_events.5.a:0 "Negotiation First, Force Second"
 california_events.5.desc:0 "Our attempts to negotiate with the strikers has been met with some success. The general strike has resulted in a much less militant and more moderate union taking control, and they are willing to call of the strike in turn for meeting some of their more important demands.\n    While unpopular with some more extreme socialists and conservatives most people are happy with the outcome and business in the city has already resumed as normal."
 california_events.5.t:0 "Negotiations" 
 california_events.6.t:0 "Sinclair Wins"
 california_events.6.a:0 "Can't Make Everyone Happy"
 california_events.6.desc:0 "After almost two years of campaigning the first step of the EPIC plan has succeeded. California is now under the role of an explicitly socialist governor for the first time in it's history. However this is not a total victory. Conservatives, moderates, reactionaires, even businessmen still maintain power in the capital and it will be long years of bitter work for this to change. One only hopes that Upton Sinclair, a man with no experience whatsoever in politics, knows what he's doing.\n    At his inaguration cermony the elect has pledged to forgive and forget all the foul things the former governor has said and to start anew. Additionally he immediately pardoned Thomas J. Money, apologizing to him for the injustice done to him for the past eighteen years.\n    He went on to condemn capitalism and 'big business' and has called for the unselfish efforts of every true citizen to aid his plan. Many were shocked by his plain dress and his cancelation of any celebratory events usual after a successful election."
 california_events.7.a:0 "Mala Suerte"
 california_events.7.desc:0 "The governor has ordered the National Guard to intervene in the San Joaquin valley strikes in order to disarm the protestors and desecalate. Whlie they have succeeded in breaking up the strike it remains to be seen whether their will be any escalation from the valley."
 california_events.7.t:0 "Deploy Guard to Joaquin"
 california_events.8.a:0 "As Long As They Get Back to Work"
 california_events.8.desc:0 "Negotiations with the strikers, greatly aided by George Creel, chair of the Regional Labor Board(which has no real authority) have succeeded. The workers have agreed to return to work on the condition that they now be paid 75 cents per hundred pounds, instead of the demanded 80 and previous 60. Additionally the workers are to recieve relief payments from the state government.\n    Despite the majority of the strikers being in favor of participating their leadership in the CAWIU has agreed, and as such work should return to normal in that valley."
 california_events.8.t:0 "Negotiations in Joaquin"
 california_events.9.a:0 "Depressing"
 california_events.9.desc:0 "Many of the workers in San Joaquin have decided to leave the country altogether. Many of them were already foriegners with family in different countries and have decided that they'd be better off trying to find work there.\n    Many of the farms they once worked remain empty and unworked, and the local economy has already started to collapse."
 california_events.9.t:0 "Workers Leave"
 california_events.10.a:0 "If You Give a Mouse a Cookie"
 california_events.10.desc:0 "While talk of further striking has died down in San Joaquin, across the country many unions have seen their success and will undoubtedly try to replicate it. However we can put away our worries about a revolution for now."
 california_events.10.t:0 "Emboldend Strikers"
 california_events.11.a:0 "Is This Justice?"
 california_events.11.desc:0 "New from San Jose today as the heavily publicized kidnapping of Brooke Hart, a young businessman has ended in murder. Heir of one of California's best known businesses, L Hart & Son, well known for its phenomenal customer service and deep loyaltly from customers and consumers alike. Many feel great sympath for the poor family.\n    What is most shocking however is that the lynchings of his acused murderers are already being publicly planned and the Governor is openly supporting them, promising he would pardon anyone convicted of the lynching."
 california_events.11.t:0 "Murder of Brooke Hart"
 california_events.12.a:0 "A Nation of Laws?"
 california_events.12.desc:0 "News today as Thomas Thurmond and John M. Holmes, the alleged killers of Brooke Hart have been lynched today by a mob. Scores of reporters, photographers, newsreel camera operators, and as many as 10,000 men, women, and children have born witness to the crime.\n    Despite the documentary evidence no one has been convicted and newspapers have deliberately smudged published photos to hide anyone identifiable. The sales from local newspapers the next Monday were almost double the normal production."
 california_events.12.t:0 "Is This Justice?"
 california_events.27.t:0 "Support From California"
 california_events.27.desc:0 "California has decided to send material aid to us. This will be a help to our efforts."
 california_events.27.a:0 "Finally, Good News..."