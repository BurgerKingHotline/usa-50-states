 california_events.23.t:0 "Democratic Convention"
 california_events.23.desc:0 "The Democratic convention to determine who should be the nominee for the 1934 gubernatorial ticket. In a surprising political upset, Upton Sinclair has won overwhemingly, winning more than the rest of the candidates combined.\n      What this means is that for the next couple months the Democrat party machinery will serve to deliver a socialist into the presidency.\n      Less significantly Upton Sinclair has been kicked from the Socialist Party of America, due to their strict rules on running for other parties. However this move has essentially destroyed the party within California as Sinclair takes the moderates with him."
 california_events.23.a:0 "But Can He Win The Public?"
