 california_events.16.t:0 "Strikers In Joaquin"
 california_events.16.desc:0 "Joaquin Valley produces more cotton per acre than the deep south, and all of this is done through cheap mexican and philippino labor. Multiple unions, most prominently the militant Cannery and Agricultural Worker's Industrial Union, have convened to organize a strike, demanding higher pay. Already things have turned violent as hundreds of families are evicted from the homes for participating in the strike\n   Thousands gather in camps leased by the unions, often outnumbering the neighboring towns. The local police and local government are firmly on the side of the growers, and have been aiding them in their all-out war against the strikers.\n   It seems that we have yet another strike to keep an eye on."
 california_events.16.a:0 "Add It To The List"
 california_events.17.t:0 "DEFUNCT"
 california_events.17.desc:0 "DEFUNCT"
 california_events.17.a:0 "DEFUNCT"
 california_events.18.t:0 "Pixley Murders"
 california_events.18.desc:0 "The cotton strikes in Joaquin were violent from the start but now they are starting to escalate into full on warfare. Early this morning ranchers and policement surronded a group of strikers, resulting in a shoot out between the two groups. Several dead and even more are injured.\n   The most significant outcome of this has been and outpouring of sympathy for the strikers from the general Californian public. Action is demanded unless we wish to look like absolute fools.\n   We have two options. We can either attempt to negotiate with the strikers, while the growers will not agree to a pay increase we can offer monetary aid on the condition they return to work. Alternatively we could disarm the strikers, effectively leaving them defenless to further acts of violence, but protecting the growers' cotton and those still working. Either option is acceptable as long as it leads to an end in violence."
 california_events.19.t:0 "Negotiations Failures"
 california_events.19.desc:0 "Despite our best attempts negotiations have failed to come to any meaningful compromise. The vast majority of the pickers support continuining the strikes, and the violence and mistreatment has only hardend the resolves of the CAWIU leadership.\n      While multiple officials put up an impressive effort to end the strikes it seems that we will now have to resort to force, as it is unnaceptable for our reputation if the violence is too continue."
 california_events.19.a:0 "Compromise Isn't Always A Solution"
