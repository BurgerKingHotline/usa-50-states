 CAL_civilwar_cat_desc:0 "As California plunges into deeper and deeper violence militias are forming to protect local communities, protect unions, or even to overthrow the government. These militias have general ideological loyalties, and will help whatever faction best aligns with their views. Should war ever break out inside the state, these militias would undoubtedly be called into action.\n         The strength and number of these militias may ebb and flow based on particular events, choices, or focuses taken. Additionally there are a panoply of decisions we can take, to strengthen our faction. But be careful, if our popularity gets too low and we lose the elections, there will be consequences...\n\n§2----xxxx----Conservative Militias----xxxx----\n§T[?CAL_conservative_banner_bonus]\n\n§R----xxxx----Socialist Militias----xxxx----\n§T[?CAL_socialist_banner_bonus]\n\n§8----xxxx---Fascist Militias----xxxx----\n§T[?CAL_fascist_banner_bonus]"
