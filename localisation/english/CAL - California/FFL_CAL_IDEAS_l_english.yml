 CAL_great_depression_simple: "Great Depression"
 CAL_great_depression_simple_desc: "The great depression was the near total economic collapse of the United States and one of the most important contributors to the great collapse. However while the union is gone the depression remains."
 CAL_great_depression_worse_simple: "Great Depression"
 CAL_great_depression_worse_simple_desc: "The great depression was the near total economic collapse of the United States and one of the most important contributors to the great collapse. However while the union is gone the depression remains."
 CAL_widespread_strikes: "Total Engagement"
 CAL_widespread_strikes_desc: "The struggle between labor and capital in California is characterizes as a total engagement, a total struggle between the two. As crops root in the field as it is cheaper than to sell them, the worker unionizes to get what's his, and the owners get even more miserly, the violence betweeen the two only gets worse. This is one of the defining characterstics of California today, the wave after wave of strikes and union busts that result in needless deaths and violence. Even with government intervention it seems impossible that this will ever reach a peaceful end."
 CAL_widespread_strikes_2: "Total Engagement"
 CAL_widespread_strikes_2_desc: "The struggle between labor and capital in California is characterizes as a total engagement, a total struggle between the two. As crops root in the field as it is cheaper than to sell them, the worker unionizes to get what's his, and the owners get even more miserly, the violence betweeen the two only gets worse. This is one of the defining characterstics of California today, the wave after wave of strikes and union busts that result in needless deaths and violence. Even with government intervention it seems impossible that this will ever reach a peaceful end." 
 CAL_corporate_influence: "Corporate Influence"
 CAL_corporate_influence_desc: "One of the most major forces in Californian political life is the deeply conservative megacorporations that dominate the valley's economy. Even despite the great depression they have maintained and even grown their already considerable infleunce."
 CAL_sunshine_state: "Sunshine State"
 CAL_sunshine_state_desc: "It is said that in California when someone is hot and tired they can simply find a fruit tree to lay under, and that when they are hungry they only have to lift up their head and fruit will fall into their mouths. Despite the numerous problems of the golden state these comparisons to Eden are not totally inaccurate, with her higher wages, better climate, and better government aid. This myths attract tens of thousands of Americans fleeing the condition in their own states, and inevitably are disappointed."
 CAL_disorganized_military: "Disorganized Military"
 CAL_disorganized_military_desc: "The Californian military is still, for lack of a better term, being improvised. While the national guard provides a blueprint and framework for the new state's military, it is still woefully inadequate. Many new divisions have been hastily scrambled together without proper training or equipment, yet the army is still unable to properly maintain it's borders, or even military control of large swathes of the state."
