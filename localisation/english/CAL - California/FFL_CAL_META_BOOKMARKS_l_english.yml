 CAL_GREAT_COLLAPSE_DESC:0 "In all of the Golden States history there has never been such chaos. Strikers are murdered by their employers, seperatists seek to carve out a new state, and socialists seek to overthrow the old capitalist order. Candidates are slandered as never before, and the whole weight of California seems to be set violently against itself.\n   There is a thunder over California, and only one side will prevail. For a house divided against itself, cannot stand..."
