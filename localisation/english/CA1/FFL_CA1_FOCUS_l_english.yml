l_english:
 CA1_sunny_man_sunny_state:0 "Sunny Man, Sunny State"
 CA1_sunny_man_sunny_state_desc:0 "California and James Rolph are quite an excellent pair, both known for their attractiveness and pleasantness. However times are hard for everyone, with unemployment at 28 percent and in an almost entirely rural/agrarian economy funds needed to provide relief are not forthcoming. But Rolph is committed to helping his citizens, somehow..."
 CA1_support_vigilantism:0 "Decent People Must Maintain Order"
 CA1_support_vigilantism_desc:0 "As our nation falls into chaos good and decent people must maintain it themselves, throw force and militia. Our governor's support for lynchings is well known, but now we must call for the people to take up their constitutional right to bear arms and defend themselves and their communities since we ourselves are largely unable."
 CA1_fund_state_emergency_relief:0 "Fund State Emergency Relief"
 CA1_fund_state_emergency_relief_desc:0 "With the end of the federal government means the end of the federal aid which provided essential relief for countless Californians at their lowest point. We must pick up the slack!"
 CA1_good_radio_program:0 "It Was A Good Radio Program"
 CA1_good_radio_program_desc:0 "The federal government revoked Robert P. Shuler's radio license for the Keep God Ever First station due to his fiery attacks \"against everybody and everything\". Virulently anti-semitic and anti-catholic, he is still politically active and popular, and many demand that his radio program which once regularly pulled in over 600,000 listeners be allowed to restart."
 CA1_let_loose_navy:0 "Let Loose Navy"
 CA1_let_loose_navy_desc:0 "It is a closely held secret, and one that is dangerous to know, that certain elements in the navy are supporting the fascistic movements in southern California by them selling guns and military grade weaponry. Whether done for ideological reasons or because of pure corruption, this current state of affairs benefits our own ambitions and should thus be shielded from prying eyes."
 CA1_burton_fitts:0 "Meet With Burton Fitts"
 CA1_burton_fitts_desc:0 "Who is Burton Fitts? He is a lawyer who made his career on covering up the darker excesses of Hollywood, he is a former lieutenant governor and gubernatorial candidate, and most importantly to us, he is the well connected and influential D.A. of Los Angeles. He is not afraid to abuse this power for his own personal gain either, and by promising to help him soar to ever greater political heights he will help our little coup too."
 CA1_patriotic_organizations:0 "Patriotic Organizations"
 CA1_patriotic_organizations_desc:0 "Why should fascists be discriminated against, are they not just as patriotic and law abiding as any other American? For too long the Klu Klux Klan among other proud and white organizations have been forced to cower in the shadows, but with our help no more!"
 CA1_new_rules_hollywood:0 "New Rules New Hollywood"
 CA1_new_rules_hollywood_desc:0 "Georg Glyssing the Nazi diplomat has been making the rounds around Hollywood, threatening Hollywood executives with the threat of their movies being banned in Germany, a market essential to their business, and promising reprisals against family back home to Jewish screenwriters and actors. That is of course, unless they refuse his excellent suggestion of guidelines for American films:\n1. Films may Not Feature Jewish Characters.\n2. Jewish actors could not feature in any films exported to Germany.\n3. Jewish Life could not be portrayed in a positive way.\n4. No defamation of Germany or its Nazi leaders,\n5. German characters in films could not be portrayed in a negative manner.\nAnd of course, we will need to cancel the production of The Mad Dog of Europe, a small price to pay for Hollywoods execs to keep their fat checks."
 CA1_slander_sinclair:0 "Slander Sinclair"
 CA1_slander_sinclair_desc:0 "We have the capabilities to bury Sinclair under a mountain of lies and accusations, it doesn't matter if any of them are true, anything is worth it too keep a socialist from coming into power."
 CA1_friends_new_germany:0 "Friends of New Germany"
 CA1_friends_new_germany_desc:0 "We shall help setup the Friends of New Germany party, a political organization of German-Californians, who wish to express their support of their home country and to advance mutual friendship between our too countries. After all, we are in desperate need of allies to help us out of the rut we've found ourselves in."
 CA1_porters_xenophobia:0 "Porter's Xenophobia"
 CA1_porters_xenophobia_desc:0 "Many things are done in the shadows in the city of Angeles, and the political currents here are always adventurous and never certain. The incumbent Mayor of Los Angeles, a staunch supporter of prohibition, a white protestant supremacist, and a fiery reformer promising and end to corruption, he shall be the one to lead our movement forward."
 CA1_shaws_corruption:0 "Shaw's Corruption"
 CA1_shaws_corruption_desc:0 "Many things are done in the shadows in the city of Angeles, and the political currents here are always adventurous and never certain. The challenger to Porter's Los Angeles Mayoralty, Shaw has earned the trust of those most alienated by his opponents fiery and exclusionary rhetoric. And with the backing of the mob and the corrupt establishment to boot, he shall be the one to lead our movement forward."
 CA1_crusade_against_vice:0 "Crusade Against Vice"
 CA1_crusade_against_vice_desc:0 "Porter was propelled into power promising to bring an end to the soft-handed approach of the police towards prohibtion and prostitution, as well as to lead a good and moral protestant administration. Although this will alienate many, it's a worthy price to pay to clean up the city."
 CA1_support_minority_communities:0 "Backing of the Negro"
 CA1_support_minority_communities_desc:0 "Somehow, despite his fascistic tendencie Shaw has earned the trust of many of the minority communities of Los Angeles and especially, and most suprisingly from local Negro politicans. This could prove useful in the future, provided that his new friends can look past him being a shameless crook."
 CA1_crush_sinclairism:0 "Crush Sinclairism"
 CA1_crush_sinclairism_desc:0 "Los Angeles has longed served as the hub for the communistic E.P.I.C. campaign with Upton Sinclair rarely making a campaign appereance outside the city. With the police and true and honest patriots by our side, we shall crush the strings of Moscow over our city!"
