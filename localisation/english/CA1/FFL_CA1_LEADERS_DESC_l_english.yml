 CA1_james_rolph_desc:0 "James Rolph was born ub August 23, 1869 in San Francisco California. In 1911 he would run for mayor of San Francisco and win, an office he would hold for 19 years. During this time he developed a reputation as \"Sunny Jim\" for his upbeat and pleasant personality, even appearing as himself in a few films.\n         He also developed friendships within the Roman Catholic church that would serve his political career well, helping him win the votes of the Irish, Italians, French, and Germans who made up most of the cities population.\n         In 1931 he resigned to become governor, an election which he won easily due to his wide popularity, and has since then served during the worst lows of the depression thus far. So far he has been able to keep things together but if he should ever disappear there would be no one left to keep the warring factions from each others throats."
