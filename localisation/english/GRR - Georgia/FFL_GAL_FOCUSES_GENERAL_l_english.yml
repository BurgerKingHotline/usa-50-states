 GAL_gold_fish_bowl_desc:0 "One of the many things promised to the people was a more open government. To achieve this the Governor has ordered a reception room fitted into the executive offices with tables provided for the press and about a hundred seats for the public. Every day he will give interviews to anyone who gives a good reason to see him and answer any of their questions with the help of his advisors and attorneys.\n\nSinclair was the first to call this room the Gold-Fish Bowl and that has soon become it's unofficial name."
