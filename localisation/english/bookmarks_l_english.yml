 GREAT_COLLAPSE_NAME:0 "The Great Collapse"
 GREAT_COLLAPSE_DESC:0 "The Great Collapse describes the fall of the United States of America as a national entity."
 CAL_GREAT_COLLAPSE_DESC:0 "For the first time in almost a century California is once again an independent country and her future is once again uncertain.\n    Upton Sinclair, a life long socialist, muckraker, and author of the 'Jungle' offers a bold promise, to eliminate poverty in California through the economics of cooperation.\n    Frank Merriam, James Rolph's liteunant governor offers a continuation of the conservative status quo that has held since 1879; and he is willing to wade into the mud to get it."
 