l_english:

 # ============================================================
 # SECOND LAYER FOCUSES
 # ============================================================

 WSH_reconstruct_the_economy: "Reconstruct the Economy"
 WSH_reconstruct_the_economy_desc: "The emergency budget bought time. The next three to five years decide whether Washington has an economy of its own or only a ledger."
 WSH_ten_million_legacy: "The Ten Million Dollar Legacy"
 WSH_ten_million_legacy_desc: "Martin's relief bond was a loan against the future. Spend it on things that will still be standing when it comes due."
 WSH_columbia_basin_survey: "Finish the Columbia Basin Survey"
 WSH_columbia_basin_survey_desc: "Engineers have walked the Columbia for a decade. Finishing the survey turns a dream of irrigation and cheap power into a project with a price."
 WSH_state_banking_system: "Build a State Banking System"
 WSH_state_banking_system_desc: "Banks failed, and the money they held went with them. A public bank can lend where private ones will not."
 WSH_stabilize_grain_belt: "Stabilize the Grain Belt"
 WSH_stabilize_grain_belt_desc: "Wheat sells for less than it costs to grow. Credit, storage and foreclosure relief keep the Palouse farms from becoming a wasteland of auctions."
 WSH_reopen_timber_mills: "Reopen the Timber Mills"
 WSH_reopen_timber_mills_desc: "The mills along the Sound and Grays Harbor stand cold. Restarting them puts thousands back on payroll, on whatever terms the owners can be made to accept."
 WSH_port_labor_accord: "The Port Labor Accord"
 WSH_port_labor_accord_desc: "Seattle and Tacoma move the state's wealth. An accord with the longshoremen buys peace on the docks and a share of the revenue."
 WSH_public_power: "Public Power for the Republic"
 WSH_public_power_desc: "Grand Coulee will make more power than Washington can use. Whoever owns the wires owns the next fifty years."
 WSH_settle_the_labor_question: "Settle the Labor Question"
 WSH_settle_the_labor_question_desc: "Strikes, hunger marches and unemployed councils will not wait for a constitution. The republic must say what it owes working people and what it will tolerate from them."
 WSH_recognize_collective_bargaining: "Recognize Collective Bargaining"
 WSH_recognize_collective_bargaining_desc: "Unions get a seat at the table and a legal right to be there. Employers will call it ruin; organizers will call it overdue."
 WSH_incorporate_ucl: "Incorporate the Unemployed Citizens League"
 WSH_incorporate_ucl_desc: "The League's commissaries and barter networks already feed Seattle. Making them a public institution folds a movement into the state."
 WSH_break_unemployed_councils: "Break the Unemployed Councils"
 WSH_break_unemployed_councils_desc: "The councils organize evictions blocked and hunger marches staged. The Guard and the sheriffs can end both, at a cost that will be remembered."
 WSH_repeal_criminal_syndicalism: "Repeal Criminal Syndicalism"
 WSH_repeal_criminal_syndicalism_desc: "The old law makes membership in the IWW a felony. Repeal says that opinions are not crimes, and that Washington is not afraid of its own workers."
 WSH_open_shop_republic: "The Open Shop Republic"
 WSH_open_shop_republic_desc: "No worker may be compelled to join a union and no employer to bargain with one. Business confidence rises; so does the temperature in the union halls."
 WSH_general_strike_test: "The General Strike Test"
 WSH_general_strike_test_desc: "Seattle has shut itself down before. Whether a general strike ends in a settlement or in bayonets depends on what the government has built up to now."
 WSH_labor_charter: "The Labor Charter"
 WSH_labor_charter_desc: "Wages, hours, bargaining rights and the limits of both, written into a single document that employers and unions can each read and neither can ignore."
 WSH_settle_the_civic_question: "Settle the Civic Question"
 WSH_settle_the_civic_question_desc: "Who belongs in Washington, and on what terms? The answer will be written into land law, school boards and the conduct of sheriffs."
 WSH_defeat_initiative_49: "Defeat Initiative 49"
 WSH_defeat_initiative_49_desc: "A ballot measure promises to settle the question by exclusion. The state can fight it, ignore it, or quietly let it die in committee."
 WSH_preserve_alien_land_acts: "Preserve the Alien Land Acts"
 WSH_preserve_alien_land_acts_desc: "The laws bar Asian immigrants from owning farmland. Keeping them calms the nativist counties and costs the Valley's farms their most productive growers."
 WSH_repeal_alien_land_acts: "Repeal the Alien Land Acts"
 WSH_repeal_alien_land_acts_desc: "Repeal opens the Yakima and Puyallup valleys to the people who built them. Some counties will never forgive it."
 WSH_protect_valley_communities: "Protect the Valley Communities"
 WSH_protect_valley_communities_desc: "Japanese-American and Filipino farm workers keep the harvest running and have no one to complain to. The state can give them a court that will listen."
 WSH_university_question: "The University Question"
 WSH_university_question_desc: "The University of Washington's regents answered to Olympia and its faculty answered to no one. Autonomy or control will shape a generation of lawyers, engineers and officers."
 WSH_investigate_the_vigilantes: "Investigate the Vigilantes"
 WSH_investigate_the_vigilantes_desc: "Night riders, Legionnaires and county posses have acted as the law in towns with no police. A commission can name them or look away."
 WSH_common_washington_citizenship: "A Common Washington Citizenship"
 WSH_common_washington_citizenship_desc: "One status for everyone born or naturalized within the state's borders, with the same courts, the same schools and the same claim on the republic."
 WSH_secure_the_successor_state: "Secure the Successor State"
 WSH_secure_the_successor_state_desc: "Recognition, river access, customs revenue and a defensible coastline matter more than conquest. Washington must be seen as a state before it can act like one."
 WSH_secure_puget_sound: "Secure Puget Sound"
 WSH_secure_puget_sound_desc: "The Navy Yard at Bremerton and the forts on the Strait are the best-armed places left in the northwest. Whoever holds them holds the Sound."
 WSH_guard_the_columbia: "Guard the Columbia"
 WSH_guard_the_columbia_desc: "The river is a border, a highway and a power source. Posts at the narrows keep it open for Washington's barges and closed to anyone else's."
 WSH_canadian_trade_route: "The Canadian Trade Route"
 WSH_canadian_trade_route_desc: "British Columbia needs grain, coal and a friendly neighbor. The road and rail lines north are the shortest way to hard currency."
 WSH_inland_grain_corridor: "The Inland Grain Corridor"
 WSH_inland_grain_corridor_desc: "Spokane's rail yards link the wheat country to Idaho and Montana. A treaty keeps the freight moving and the grain flowing toward the Sound."
 WSH_pacific_defense_command: "A Pacific Defense Command"
 WSH_pacific_defense_command_desc: "Coast artillery, Guard brigades and what remains of the fleet answer to one headquarters, or they answer to no one."
 WSH_federal_restoration_question: "The Federal Restoration Question"
 WSH_federal_restoration_question_desc: "Some successor governments still claim the old Union's mantle. Washington can talk to them, as an equal or as a province waiting to be reclaimed."
 WSH_washington_will_stand_alone: "Washington Will Stand Alone"
 WSH_washington_will_stand_alone_desc: "The Union is not coming back. Washington will be a nation or it will be nothing, and it will say so to anyone who asks."

 # ============================================================
 # EVENTS, IDEAS, DECISIONS
 # ============================================================

 WSH_first_national_budget_desc: "The treasury has a policy, the Guard has a commander, the federal estate has a custodian, and relief has a shape. It remains only to write all four decisions into a single budget. The budget does not erase the choices behind it. It records them, and the country that results is the sum of what was chosen."
 WSH_1933.1.t: "Martin Takes the Oath, Hartley's Machine Stays"
 WSH_1933.1.desc: "The certificate bears Clarence Martin's name, but the offices, the committee chairmanships and half the Guard's officer corps were appointed by Roland Hartley. Martin governs a building he does not control."
 WSH_1933.1.a: "The machine will have to be bargained with."
 WSH_1933.2.t: "Hartley Claims Continuity"
 WSH_1933.2.desc: "Hartley's lawyers argue that a state government that has not fallen cannot be replaced, only continued. With Washington City gone, no one is left to say otherwise. The claim is accepted as a measure of necessity, not as an election."
 WSH_1933.2.a: "Continuity, then."
 WSH_1933.3.t: "The Convention Convenes"
 WSH_1933.3.desc: "Delegates from the counties, the unions, the chambers of commerce and the Guard crowd into the legislative chamber. They have refused both men. Someone must now hold the office until the convention finishes its work, and the delegates disagree sharply on who."
 WSH_1933.3.a: "Martin takes the chair."
 WSH_1933.3.b: "Hartley's caretaker administration."
 WSH_1933.3.c: "A convention committee governs."
 WSH_1933.10.t: "What Does the State Government Become?"
 WSH_1933.10.desc: "Certification settled who sits in the governor's office. It did not settle what the office is. Does Washington inherit the machinery of a state, or does that machinery become the provisional government of a nation?"
 WSH_1933.10.a: "State continuity, with the legislature and counties intact."
 WSH_1933.10.b: "Emergency national authority in the governor's hands."
 WSH_1933.10.c: "A constitutional convention to write the answer down."
 WSH_1933.50.t: "The Commercial Executive State"
 WSH_1933.50.desc: "A balanced ledger, a loyal Guard and charities in place of public relief. Business is calm and the governor is strong. The union halls are crowded and the relief queues are long."
 WSH_1933.50.a: "Order and solvency, for those who have jobs."
 WSH_1933.51.t: "The Developmental Republic"
 WSH_1933.51.desc: "Relief bonds, a civilian Guard and public payrolls. The debt grows, but so do the roads, the ports and the state's claim to be a government that serves its people."
 WSH_1933.51.a: "Debt is a cost of building something."
 WSH_1933.52.t: "The Labor Commonwealth"
 WSH_1933.52.desc: "The federal estate is public property and relief is organized by those who need it. Employers are alarmed. In the unemployed councils, the word republic is being said without irony."
 WSH_1933.52.a: "The state belongs to those who keep it running."
 WSH_1933.60.t: "What Shall Washington Become?"
 WSH_1933.60.desc: "The emergency is contained. The choices made in the first months have narrowed the paths ahead. What remains is to give those choices a name and a constitution."
 WSH_1933.60.a: "The Martin Reconstruction Republic."
 WSH_1933.60.b: "The Hartley Continuity Republic."
 WSH_1933.60.c: "The Washington Commonwealth."
 WSH_1933.60.d: "The Emergency Security State."
 WSH_1933.60.e: "The County Compact Republic."
 WSH_relief.1.t: "The Charities Cannot Feed the State"
 WSH_relief.1.desc: "The churches and lodges have given everything they had. The kitchens run out of soup by noon, and the line outside grows by dusk."
 WSH_relief.1.a: "Open public kitchens."
 WSH_relief.1.b: "The charities will manage."
 WSH_relief.2.t: "The Seattle Relief Queue"
 WSH_relief.2.desc: "The queue outside the Seattle commissary now stretches four blocks. Police are nervous. Organizers are not."
 WSH_relief.2.a: "Clear the street."
 WSH_relief.2.b: "Open an emergency commissary."
 WSH_relief.3.t: "The Klan Offers Order"
 WSH_relief.3.desc: "Men in robes have appeared at the county courthouses, offering to keep order where the sheriffs cannot. Some of the sheriffs are accepting."
 WSH_relief.3.a: "Accept the auxiliaries."
 WSH_relief.3.b: "Refuse them."
 WSH_politics.1.t: "Who Controls the Lights?"
 WSH_politics.1.desc: "Power, water and the telephone exchange are running again. Whoever owns them now will own them when Grand Coulee comes online."
 WSH_politics.1.a: "A public utility authority."
 WSH_politics.1.b: "A private utility compact."
 WSH_politics.1.c: "County utility boards."
 WSH_politics.1.d: "Labor-management boards."
 WSH_region.1.t: "The County Compact"
 WSH_region.1.desc: "The eastern counties want control of their sheriffs, their relief money and a share of what the Sound ports earn. They have not threatened to leave, but they have said the word."
 WSH_region.1.a: "Let the counties keep policing and relief."
 WSH_region.1.b: "Share the Puget Sound port revenue."
 WSH_region.1.c: "Hold the central line."
 WSH_region.2.t: "Regional Settlements"
 WSH_region.2.desc: "The Yakima Valley, Spokane's banks, the southwest timber tax and the Sound's port revenue each have a claim, and the claims cannot all be met."
 WSH_region.2.a: "State courts protect the Valley's workers."
 WSH_region.2.b: "Leave order to the county sheriffs."
 WSH_region.2.c: "Settle by revenue and let the rest follow."
 WSH_diplomacy.1.t: "The First Treaties"
 WSH_diplomacy.1.desc: "Oregon, British Columbia, Idaho and California each want something, and each is watching to see whether Washington is a state or an episode. Which door opens first?"
 WSH_diplomacy.1.a: "Agree on the Columbia with Oregon."
 WSH_diplomacy.1.b: "Open the northern trade route to British Columbia."
 WSH_diplomacy.1.c: "Sign a grain and rail agreement with Idaho."
 WSH_diplomacy.1.d: "Sign a Pacific shipping agreement with California."
 WSH_diplomacy.1.e: "Open talks with the federal claimants."
 WSH_martin_inauguration_crisis: "Martin's Contested Mandate"
 WSH_martin_inauguration_crisis_desc: "Clarence Martin holds the office, but the Hartley appointees still hold the building."
 WSH_hartley_continuity: "Hartley's Continuity Claim"
 WSH_hartley_continuity_desc: "Hartley governs on the argument that a state in crisis cannot afford a new government."
 WSH_provisional_state_authority: "Provisional State Authority"
 WSH_provisional_state_authority_desc: "The old laws still apply, but nobody is sure who answers to whom. This lasts until the republic is defined."
 WSH_commercial_executive_order: "Commercial Executive Order"
 WSH_commercial_executive_order_desc: "A strong governor, a quiet business community and a restless working class."
 WSH_developmental_order: "Developmental Order"
 WSH_developmental_order_desc: "Public works, public debt and a government that expects to be around to repay it."
 WSH_labor_commonwealth_order: "Labor Commonwealth Order"
 WSH_labor_commonwealth_order_desc: "Relief and ownership are organized from below, and employers are watching."
 WSH_martin_reconstruction_republic: "Martin Reconstruction Republic"
 WSH_martin_reconstruction_republic_desc: "Representative institutions, public works, a state bank and regulated private industry."
 WSH_hartley_continuity_republic: "Hartley Continuity Republic"
 WSH_hartley_continuity_republic_desc: "Executive-led but formally constitutional, with low taxes, an open shop and strong counties."
 WSH_washington_commonwealth: "Washington Commonwealth"
 WSH_washington_commonwealth_desc: "Labor representation, cooperative relief, public ownership and a Farmer-Labor constitution."
 WSH_emergency_security_state: "Emergency Security State"
 WSH_emergency_security_state_desc: "Executive or military rule, anti-radical repression and a ready audience for reactionary movements."
 WSH_county_compact_republic: "County Compact Republic"
 WSH_county_compact_republic_desc: "Sovereignty is shared among strong regional governments and a weak central treasury."
 WSH_veto_emergency_spending: "Veto Emergency Spending"
 WSH_veto_emergency_spending_desc: "The governor's pen saves money and spends goodwill."
 WSH_issue_relief_bond: "Issue the $10 Million Relief Bond"
 WSH_issue_relief_bond_desc: "Borrow against the future to feed the present."
 WSH_fund_minor_public_works: "Fund Minor Public Works"
 WSH_fund_minor_public_works_desc: "Small projects in every county keep payrolls moving."
 WSH_appropriate_columbia_basin_funds: "Appropriate Columbia Basin Funds"
 WSH_appropriate_columbia_basin_funds_desc: "Each appropriation moves the Columbia Basin project one stage closer. It cannot be rushed."
 WSH_guarantee_county_relief_payments: "Guarantee County Relief Payments"
 WSH_guarantee_county_relief_payments_desc: "The state takes responsibility for relief that bankrupt counties can no longer pay."
 WSH_build_emergency_roads: "Build Emergency Roads"
 WSH_build_emergency_roads_desc: "Road crews are paid in cash, and the cash is spent in the nearest town."
 WSH_repair_ports_and_railways: "Repair Ports and Railways"
 WSH_repair_ports_and_railways_desc: "The docks and rail yards carry the whole economy."
 WSH_begin_columbia_basin_survey: "Begin the Columbia Basin Survey"
 WSH_begin_columbia_basin_survey_desc: "Engineers begin to map the river's dam sites and irrigation lands."
 WSH_guarantee_public_payrolls: "Guarantee Public Payrolls"
 WSH_guarantee_public_payrolls_desc: "Teachers, clerks and road crews are paid on time, whatever it costs."
 WSH_incorporate_ucl_decision: "Incorporate the UCL into the Republic"
 WSH_incorporate_ucl_decision_desc: "The Unemployed Citizens League already feeds the city. Make it official, or watch its councils act on their own."
 WSH_eastern_autonomy_movement: "Eastern Washington Autonomy Movement"
 WSH_eastern_autonomy_movement_desc: "The counties east of the Cascades are organizing. Concede something, or watch what they take."
 WASHINGTON_FREDERICK_G_HAMLEY_desc: "Leader of the New Order of Cincinnatus, the Seattle-based organization that argues the republic must be rescued by disciplined, propertied men."
 WASHINGTON_LUTHER_POWELL_desc: "Leader of the Ku Klux Klan in Washington, who offers the counties order where the sheriffs cannot."
 WSH_klan.1.t: "The Klan Moves on the New Order"
 WSH_klan.1.desc: "The county auxiliaries have outgrown the sheriffs who accepted them. Luther Powell's men now fill the New Order of Cincinnatus's halls, and Frederick Hamley's Seattle backers are losing the argument."
 WSH_klan.1.a: "Powell takes the New Order."
 WSH_fascism_party_klan: "KKK"
 WSH_fascism_party_klan_long: "Knights of the Ku Klux Klan"
