 wsh_roster_tooltip_1:0 "§H$wsh_roster_name_1$§!\nTraditionalist legislators defending private enterprise, established institutions, fiscal restraint, and incremental reform.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_2:0 "§H$wsh_roster_name_2$§!\nReligious social conservatives combining market economics with public welfare, civic duty, and institutional moral authority.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_3:0 "§H$wsh_roster_name_3$§!\nAnti-establishment legislators claiming to represent ordinary citizens against concentrated political and financial power.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_4:0 "§H$wsh_roster_name_4$§!\nRural representatives prioritizing farm credit, commodity prices, land security, local autonomy, and resistance to metropolitan dominance.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_5:0 "§H$wsh_roster_name_5$§!\nConstitutional liberals supporting representative government, regulated markets, civil administration, and measured institutional reform.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_6:0 "§H$wsh_roster_name_6$§!\nReform liberals seeking broader civic inclusion, minority participation, public investment, and cooperation across social divisions.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_7:0 "§H$wsh_roster_name_7$§!\nDemocratic socialists pursuing labor rights, public ownership, relief expansion, and redistribution through legislative government.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_8:0 "§H$wsh_roster_name_8$§!\nA coalition of organized workers and indebted farmers seeking public power, cooperative economics, and protection from corporate monopolies.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_9:0 "§H$wsh_roster_name_9$§!\nClass-based socialists interpreting the Depression as a structural crisis of capitalism and pressing for worker control of production.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_10:0 "§H$wsh_roster_name_10$§!\nRevolutionary organizers favoring a disciplined vanguard party, centralized direction, and seizure of state power during institutional collapse.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_11:0 "§H$wsh_roster_name_11$§!\nHardline centralizers supporting rapid industrial coordination, political discipline, and a commanding administrative state.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_12:0 "§H$wsh_roster_name_12$§!\nDoctrinal communists opposing compromise with market institutions, parliamentary moderation, and ideological accommodation.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_13:0 "§H$wsh_roster_name_13$§!\nAnti-state revolutionaries advocating decentralized communes, mutual aid, worker control, and abolition of coercive hierarchy.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_14:0 "§H$wsh_roster_name_14$§!\nA small spiritual-socialist current grounding economic equality, communal responsibility, and nonmaterial welfare in religious ethics.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_15:0 "§H$wsh_roster_name_15$§!\nUltranationalist legislators demanding centralized authority, social regimentation, militarized civic life, and suppression of organized opposition.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_16:0 "§H$wsh_roster_name_16$§!\nRacial-nationalist extremists combining dictatorship, paramilitary politics, exclusion, and total subordination of society to the nation.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_17:0 "§H$wsh_roster_name_17$§!\nA locally adapted racial-nationalist movement using economic crisis, anti-radicalism, and social resentment to justify authoritarian rule.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_18:0 "§H$wsh_roster_name_18$§!\nCorporatist nationalists advocating an organic state organized through disciplined occupational bodies, religion, and hierarchical political unity.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_19:0 "§H$wsh_roster_name_19$§!\nClerical authoritarian populists combining moral restoration, executive power, anti-parliamentarianism, and mass political mobilization.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_20:0 "§H$wsh_roster_name_20$§!\nAuthoritarian expansionists favoring personal rule, military hierarchy, state mythology, and a formally stratified political order.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_21:0 "§H$wsh_roster_name_21$§!\nReactionary nationalists treating the state as an indivisible historical community superior to parties, classes, and individual rights.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_22:0 "§H$wsh_roster_name_22$§!\nState-centered nationalists defining political loyalty through citizenship, public service, institutional unity, and defense of Washington sovereignty.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_23:0 "§H$wsh_roster_name_23$§!\nPersonalist officials supporting concentrated executive authority, emergency decree, and direct command over weakened institutions.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_24:0 "§H$wsh_roster_name_24$§!\nElite administrators representing major employers, financiers, utilities, and established civic institutions within emergency government.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_25:0 "§H$wsh_roster_name_25$§!\nAnti-authoritarian legislators opposing centralized government, compulsory hierarchy, and permanent emergency powers across the political spectrum.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_26:0 "§H$wsh_roster_name_26$§!\nPragmatic legislators seeking negotiated compromise, administrative continuity, and limited reform without ideological realignment.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
 wsh_roster_tooltip_27:0 "§H$wsh_roster_name_27$§!\nInstitutional brokers positioned between the principal blocs, often deciding confidence votes, budgets, and coalition survival.\n\n§YSenate Seats:§! §Y[?wsh_roster_senate_seats^roster_idx|0]§!\n§YHouse Seats:§! §Y[?wsh_roster_house_seats^roster_idx|0]§!\n§YCoalition Stability:§! §Y[?wsh_roster_stability_values^roster_idx|%0]§!"
