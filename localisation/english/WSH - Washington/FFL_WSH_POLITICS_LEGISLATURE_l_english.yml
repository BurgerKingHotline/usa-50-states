l_english:
 # Washington legislative bloc localisation
 WSH_LEGISLATIVE_BLOC_CONSERVATIVE: "Conservative Bloc"
 WSH_LEGISLATIVE_BLOC_CONSERVATIVE_TT: "§cConservative Bloc§!\nLegislators aligned with institutional conservatism, business interests, traditional civic organizations, and cautious constitutional government.\n\nSenate Seats: §Y[?wsh_senate_conservative_seats|0]§!\nHouse Seats: §Y[?wsh_house_conservative_seats|0]§!"
 WSH_LEGISLATIVE_BLOC_POPULIST: "Populist Bloc"
 WSH_LEGISLATIVE_BLOC_POPULIST_TT: "§pPopulist Bloc§!\nAgrarian organizers, anti-establishment reformers, localist movements, and representatives hostile to entrenched financial and political elites.\n\nSenate Seats: §Y[?wsh_senate_populist_seats|0]§!\nHouse Seats: §Y[?wsh_house_populist_seats|0]§!"
 WSH_LEGISLATIVE_BLOC_LIBERAL: "Liberal Bloc"
 WSH_LEGISLATIVE_BLOC_LIBERAL_TT: "§lLiberal Bloc§!\nConstitutional liberals, urban reformers, professional administrators, integrationists, and market-oriented representatives supporting representative government.\n\nSenate Seats: §Y[?wsh_senate_liberal_seats|0]§!\nHouse Seats: §Y[?wsh_house_liberal_seats|0]§!"
 WSH_LEGISLATIVE_BLOC_SOCIALIST: "Socialist Bloc"
 WSH_LEGISLATIVE_BLOC_SOCIALIST_TT: "§sSocialist Bloc§!\nLabor representatives, farmer-labor organizers, municipal reformers, and democratic socialists seeking public ownership and expanded economic protections.\n\nSenate Seats: §Y[?wsh_senate_socialist_seats|0]§!\nHouse Seats: §Y[?wsh_house_socialist_seats|0]§!"
 WSH_LEGISLATIVE_BLOC_COMMUNIST: "Communist Bloc"
 WSH_LEGISLATIVE_BLOC_COMMUNIST_TT: "§rCommunist Bloc§!\nRevolutionary labor factions and communist organizations advocating class rule, collective ownership, and the displacement of the existing political order.\n\nSenate Seats: §Y[?wsh_senate_communist_seats|0]§!\nHouse Seats: §Y[?wsh_house_communist_seats|0]§!"
 WSH_LEGISLATIVE_BLOC_NATIONALIST: "Nationalist Bloc"
 WSH_LEGISLATIVE_BLOC_NATIONALIST_TT: "§nNationalist Bloc§!\nMilitant nationalists, authoritarian corporatists, fascist organizations, and emergency-government advocates favoring centralized political authority.\n\nSenate Seats: §Y[?wsh_senate_fascist_seats|0]§!\nHouse Seats: §Y[?wsh_house_fascist_seats|0]§!"
 WSH_LEGISLATIVE_BLOC_AUTHORITARIAN: "Authoritarian Bloc"
 WSH_LEGISLATIVE_BLOC_AUTHORITARIAN_TT: "§aAuthoritarian Bloc§!\nNon-aligned power brokers, military administrators, oligarchic interests, and executive loyalists operating outside the principal ideological coalitions.\n\nSenate Seats: §Y[?wsh_senate_nonaligned_seats|0]§!\nHouse Seats: §Y[?wsh_house_nonaligned_seats|0]§!"

