 LOADING_TIP_0: "The fundamental business of the country... is on a sound and prosperous basis.\n- President Hoover"
 LOADING_TIP_1: "I am convinced we have now passed the worst and with continued unity of effort we shall rapidly recover.\n- President Hoover (1930)"
 LOADING_TIP_2: "I am the last man who would wish to be a dictator, and if you hear anyhing that sounds like a master's voice, realize that it is not mine, but the voice of the people of California.\n- Upton Sinclair"
 LOADING_TIP_3: "A republic, if you can keep it.\n- Benjamin Franklin"
 LOADING_TIP_4: "Men are losing more than their jobs today: their self-respect and human dignity are all too often being endangered.\n- Arizona Republic newspaper"
 LOADING_TIP_5: "And we know now, that government by organized money, is just as dangerous as government by organized mob.\n- Franklin Delano Roosevelt"
 LOADING_TIP_6: "A lot of people who are now fighting relief measures because they happen to possess considerable wealth will be brought in by provost guard and be obliged to give up more than they would now.\n- Floyd Olson"
 LOADING_TIP_7: "You can always count on Americans to do the right thing... After they've tried everything else.\n- Winston Churchill"
 LOADING_TIP_8: "What army?\n- Bill Blizzard"
 LOADING_TIP_9: "At what point then is then is the approach of danger to be expected? I answer, if it ever reach us, it must spring up amongst us. It cannot come from abroad.\n- Abraham Lincoln"
 LOADING_TIP_10: "We are confronted by a great responsibility. But it is reassuring and inspiring to realize that the responsibility is not greater than the opportunity.\n- Clarence D. Martin"
 LOADING_TIP_11: "No amount of money is worth a human life.\n- Roy Olmstead"
 LOADING_TIP_12: "Nothing is unfair in politics, we could sit down and figure dirty things all night, and every one of them would be all right in a political campaign.\n- Irving Thalberg"
 LOADING_TIP_13: "There is a crime here that goes beyond denuciation. There is a sorrow here that weeping cannot symbolize. There is a failure here that topples all our success.\n- John Steinbeck"
 LOADING_TIP_14: "If E.P.I.C. fails, the Communists will do the job. But do not worry, for E.P.I.C. is not going to fail.\n- Upton Sinclair"
 LOADING_TIP_15: "One nation, indivisible, with liberty and justice for all.\n- Francis Bellamy"
 LOADING_TIP_16: "What! think you these places would satisfy an Alexander, a Caesar, or a Napoleon? Never! Towering genius disdains a beaten path.\n- Abraham Lincoln"
 LOADING_TIP_17: "We shall be driven to the alternative, of taking refuge at once in the arms of monarchy, or splitting ourselves into an infinity of little jealous, clashing, tumultuous commonwealths.\n- Alexander Hamilton"
 LOADING_TIP_18: "And the perverted ambition of another class of men, who will either hope to aggrandise themselves the confusions of their country, or will flatter themselves with fairer prospects of elevation fom the subdivision of the empire.\n- Alexander Hamilton"
 LOADING_TIP_19: "Of those men who have overturned the liberties of republics the greatest number have begun their carreer, by playing an obsequious court to the people, commencing Demagogues and ending Tryants.\n- Alexander Hamilton"