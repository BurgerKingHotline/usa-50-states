 LOADING_TIP_0: "The fundamental business of the country... is on a sound and prosperous basis.\n- President Hoover"
 LOADING_TIP_1: "I am convinced we have now passed the worst and with continued unity of effort we shall rapidly recover.\n- President Hoover (1930)"
 LOADING_TIP_2: "I aimed at the public's heart and by accident I hit it in the stomach.\n- Upton Sinclair"
 LOADING_TIP_3: "A republic, if you can keep it.\n- Benjamin Franklin"
 LOADING_TIP_4: "Men are losing more than their jobs today: their self-respect and human dignity are all too often being endangered.\n- Arizona Republic newspaper"
 LOADING_TIP_5: "There are decades were nothing happens; and there are weeks where decades happen.\n- Vladimir Lenin"
 LOADING_TIP_6: "A lot of people who are now fighting relief measures because they happen to possess considerable wealth will be brought in by provost guard and be obliged to give up more than they would now.\n- Floyd Olson"
 LOADING_TIP_7: "You can always count on Americans to do the right thing... After they've tried everything else.\n- Winston Churchill"
 LOADING_TIP_8: "What army?\n- Bill Blizzard"
 LOADING_TIP_9: "At what point then is then is the approach of danger to be expected? I answer, if it ever reach us, it must spring up amongst us. It cannot come from abroad.\n- Abraham Lincoln"
 LOADING_TIP_10: "We are confronted by a great responsibility. But it is reassuring and inspiring to realize that the responsibility is not greater than the opportunity.\n- Clarence D. Martin"
 LOADING_TIP_11: "No amount of money is worth a human life.\n- Roy Olmstead"
 LOADING_TIP_12: "Nothing is unfair in politics, we could sit down and figure dirty things all night, and every one of them would be all right in a political campaign.\n- Irving Thalberg"
